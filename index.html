/* Greater Pacific dashboard kit — design tokens.
   The ONLY file allowed to contain literal colours, font sizes or spacing values (enforced by qa.ps1).
   Brand values: see brand/brand.json. Light theme only (no dark theme in the brand material). */
:root{
  color-scheme: light;

  /* Brand */
  --brand-primary:   #010039;  /* logo navy */
  --brand-secondary: #002060;  /* deck navy */
  --brand-accent:    #97A8C1;  /* website steel blue */
  --brand-on-primary:#FFFFFF;

  /* Neutral scale (cool grey, tuned toward the brand navy) */
  --n-0:   #FFFFFF;
  --n-50:  #F6F7FA;
  --n-100: #EDF0F5;
  --n-200: #DDE2EA;
  --n-300: #C5CCD8;
  --n-400: #9AA3B5;
  --n-500: #737D92;
  --n-600: #5A6377;
  --n-700: #434B5E;
  --n-800: #2A3044;
  --n-900: #141832;

  /* Surfaces, text, borders */
  --bg:            var(--n-50);
  --surface:       var(--n-0);
  --surface-sunk:  var(--n-100);
  --surface-raise: var(--n-0);
  --surface-brand: var(--brand-primary);
  --border:        var(--n-200);
  --border-strong: var(--n-300);
  --text:          var(--n-900);
  --text-muted:    var(--n-600);
  --text-subtle:   var(--n-500);
  --text-on-brand: var(--brand-on-primary);
  --link:          var(--brand-secondary);
  --focus:         #2F6FD6;
  --select-bg:     #E4EAF4;
  --hover-bg:      var(--n-100);
  --overlay:       rgba(1,0,57,.42);
  --shadow-1: 0 1px 2px rgba(1,0,57,.06), 0 1px 1px rgba(1,0,57,.04);
  --shadow-2: 0 6px 24px rgba(1,0,57,.14), 0 2px 6px rgba(1,0,57,.08);

  /* Semantic — chosen to sit apart from the navy/steel brand hues */
  --positive:    #17703F;
  --positive-bg: #E5F2EA;
  --negative:    #C00000;  /* the deck red, used only to mean "negative" */
  --negative-bg: #FBE9E9;
  --warning:     #9A5B00;
  --warning-bg:  #FBF0DC;
  --info:        #1D5FA8;
  --info-bg:     #E3EDF8;

  /* Data-viz: categorical (8), anchored on the brand navy; order = assignment order */
  --viz-1: #002060;  /* brand navy */
  --viz-2: #D9661F;  /* deck orange, deepened for contrast */
  --viz-3: #3A86C8;  /* deck light blue, deepened */
  --viz-4: #16735C;  /* teal */
  --viz-5: #8A5CB8;  /* violet */
  --viz-6: #6E5A00;  /* dark olive */
  --viz-7: #8C847C;  /* warm grey */
  --viz-8: #C2457A;  /* rose */
  --viz-muted: var(--n-300);
  --viz-band:  rgba(151,168,193,.20);
  --viz-grid:  var(--n-200);
  --viz-axis:  var(--n-400);
  --viz-median: var(--n-600);

  /* Sequential (navy, light → dark) */
  --seq-1: #EEF2F8; --seq-2: #D3DDEC; --seq-3: #A9BCD9; --seq-4: #7A96C2;
  --seq-5: #4D70A8; --seq-6: #284C8A; --seq-7: #002060;
  /* Diverging (red ↔ neutral ↔ navy) */
  --div-n3: #B2182B; --div-n2: #E07B6E; --div-n1: #F7CFC8; --div-0: #F2F2F2;
  --div-p1: #C9D6EA; --div-p2: #6F8FC4; --div-p3: #002060;

  /* Typography */
  --font-display: "Martel", Georgia, "Times New Roman", serif;
  --font-body: "Heebo", Arial, "Helvetica Neue", system-ui, sans-serif;
  --font-num: "Heebo", Arial, system-ui, sans-serif;
  --fs-display: 30px; --lh-display: 1.2;
  --fs-h1: 22px;      --lh-h1: 1.25;
  --fs-h2: 17px;      --lh-h2: 1.3;
  --fs-h3: 14px;      --lh-h3: 1.35;
  --fs-body: 14px;    --lh-body: 1.5;
  --fs-small: 13px;
  --fs-caption: 12px;
  --fs-micro: 11px;
  --fs-kpi: 24px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --tracking-caps: .07em;

  /* Spacing (4px base) */
  --s-0: 0; --s-px: 1px; --s-half: 2px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  /* Shape and layout */
  --r-1: 3px; --r-2: 6px; --r-3: 10px; --r-pill: 999px;
  --bw: 1px; --bw-2: 2px; --bw-3: 3px;
  --sidebar-w: 232px; --sidebar-w-collapsed: 60px; --header-h: 60px;
  --content-max: 1560px;
  --logo-h: 28px;  /* logo rendered height; min width 112px per brand.json */
  --icon: 16px; --dot: 8px; --spark-w: 64px; --spark-h: 18px;
  --z-header: 30; --z-drawer: 40; --z-modal: 50; --z-tip: 60;
  --dur-1: .12s; --dur-2: .35s; --dur-3: .6s;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* Greater Pacific dashboard kit — components. Uses tokens only (see tokens.css); qa.ps1 rejects literals. */
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + var(--s-4))}
body{margin:var(--s-0);background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.num,td.n,.kpi-v,.tnum{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{margin:var(--s-0);font-weight:var(--fw-semibold)}
h1{font-family:var(--font-display);font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-bold);color:var(--brand-primary)}
h2{font-family:var(--font-body);font-size:var(--fs-h2);line-height:var(--lh-h2)}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3)}
.display{font-family:var(--font-display);font-size:var(--fs-display);line-height:var(--lh-display);font-weight:var(--fw-bold);color:var(--brand-primary)}
.caption{font-size:var(--fs-caption);color:var(--text-muted)}
.eyebrow{font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);font-weight:var(--fw-medium)}
.muted{color:var(--text-muted)} .subtle{color:var(--text-subtle)}
.pos{color:var(--positive)} .neg{color:var(--negative)} .na{color:var(--text-subtle)}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:var(--bw-2) solid var(--focus);outline-offset:var(--s-half)}
.sr{position:absolute;width:var(--s-px);height:var(--s-px);overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s-2);top:var(--s-2);z-index:var(--z-modal);background:var(--surface);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);transform:translateY(-200%)}
.skip:focus{transform:none}

/* ---------- header ---------- */
.hdr{position:sticky;top:var(--s-0);z-index:var(--z-header);height:var(--header-h);background:var(--surface);border-bottom:var(--bw) solid var(--border);display:flex;align-items:center;gap:var(--s-4);padding:var(--s-0) var(--s-4)}
.hdr .logo{display:flex;align-items:center;padding:var(--s-1) var(--s-0);flex:none}
.hdr .logo img{height:var(--logo-h);width:auto;min-width:calc(var(--logo-h) * 5.5);display:block}
.hdr .prod{display:flex;flex-direction:column;min-width:var(--s-0);border-left:var(--bw) solid var(--border);padding-left:var(--s-4)}
.hdr .prod b{font-family:var(--font-display);font-size:var(--fs-h3);color:var(--brand-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:var(--fw-bold)}
.hdr .prod span{font-size:var(--fs-caption);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .grow{flex:1}
.hdr .caption{white-space:nowrap}
.hdr .conf{font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);border:var(--bw) solid var(--border);border-radius:var(--r-1);padding:var(--s-half) var(--s-2);white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:var(--s-8);min-width:var(--s-8);padding:var(--s-0) var(--s-2);border:var(--bw) solid transparent;background:transparent;border-radius:var(--r-2);color:var(--text-muted)}
.iconbtn:hover{background:var(--hover-bg);color:var(--text)}
.iconbtn svg{width:var(--icon);height:var(--icon);flex:none}
.searchbtn{white-space:nowrap;border-color:var(--border);color:var(--text-muted);min-width:calc(var(--s-16) * 3);justify-content:flex-start;background:var(--bg)}
.searchbtn kbd{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-micro);border:var(--bw) solid var(--border);border-radius:var(--r-1);padding:var(--s-0) var(--s-1);background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:var(--s-2);height:var(--s-8);padding:var(--s-0) var(--s-3);border:var(--bw) solid var(--border-strong);background:var(--surface);border-radius:var(--r-2);font-size:var(--fs-small);font-weight:var(--fw-medium);color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand-secondary);color:var(--brand-secondary)}
.btn.primary{background:var(--brand-primary);border-color:var(--brand-primary);color:var(--text-on-brand)}
.btn.primary:hover{background:var(--brand-secondary);color:var(--text-on-brand)}
.btn.sm{height:calc(var(--s-6) + var(--s-1));padding:var(--s-0) var(--s-2);font-size:var(--fs-caption)}
.btn svg{width:var(--icon);height:var(--icon)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:var(--s-1);height:calc(var(--s-5));padding:var(--s-0) var(--s-2);border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:var(--fw-semibold);white-space:nowrap;border:var(--bw) solid transparent;line-height:1}
.pill .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.pill.pos{background:var(--positive-bg);color:var(--positive)}
.pill.neg{background:var(--negative-bg);color:var(--negative)}
.pill.warn{background:var(--warning-bg);color:var(--warning)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neu{background:var(--surface-sunk);color:var(--text-muted)}
.pill.brand{background:var(--brand-primary);color:var(--text-on-brand)}
.pill.outline{background:var(--surface);border-color:var(--border-strong);color:var(--text-muted)}
.vpill{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--fs-micro);color:var(--text-muted);white-space:nowrap}
.vpill .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);align-items:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(var(--s-0),1fr);min-height:calc(100vh - var(--header-h))}
.shell.collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(var(--s-0),1fr)}
.side{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow:auto;background:var(--surface);border-right:var(--bw) solid var(--border);padding:var(--s-3) var(--s-2);display:flex;flex-direction:column;gap:var(--s-1)}
.side a{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);color:var(--text-muted);text-decoration:none;font-weight:var(--fw-medium);white-space:nowrap;overflow:hidden}
.side a svg{width:var(--icon);height:var(--icon);flex:none}
.side a:hover{background:var(--hover-bg);color:var(--text)}
.side a[aria-current=page]{background:var(--select-bg);color:var(--brand-primary)}
.side .ct{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-micro);color:var(--text-subtle)}
.side .sep{height:var(--s-px);background:var(--border);margin:var(--s-2) var(--s-1)}
.side .foot{margin-top:auto;font-size:var(--fs-micro);color:var(--text-subtle);padding:var(--s-2) var(--s-3)}
.collapsed .side a span,.collapsed .side .ct,.collapsed .side .foot{display:none}
.collapsed .side a{justify-content:center;padding:var(--s-2)}
.main{min-width:var(--s-0);padding:var(--s-5) var(--s-6) var(--s-12);max-width:var(--content-max);width:100%}
.scrim{display:none}
@media (max-width:900px){
  .shell,.shell.collapsed{grid-template-columns:minmax(var(--s-0),1fr)}
  .side{position:fixed;left:var(--s-0);top:var(--s-0);height:100vh;width:min(var(--sidebar-w), 85vw);z-index:var(--z-drawer);transform:translateX(-105%);transition:transform var(--dur-1) var(--ease);box-shadow:var(--shadow-2)}
  .drawer-open .side{transform:none}
  .drawer-open .scrim{display:block;position:fixed;inset:var(--s-0);background:var(--overlay);z-index:calc(var(--z-drawer) - 1)}
  .collapsed .side a span,.collapsed .side .ct,.collapsed .side .foot{display:revert}
  .main{padding:var(--s-4) var(--s-4) var(--s-12)}
  .hdr{gap:var(--s-2);padding:var(--s-0) var(--s-3)}
  .hdr .prod,.hdr .conf-wide,.searchbtn .lbl,.searchbtn kbd,.hdr .hide-m{display:none}
  .searchbtn{min-width:var(--s-8)}
}
@media (min-width:901px){ .only-m{display:none!important} }

/* chips bar */
.chipbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-bottom:var(--s-4)}
.chipbar:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:var(--s-1);height:var(--s-6);padding:var(--s-0) var(--s-1) var(--s-0) var(--s-3);border-radius:var(--r-pill);background:var(--select-bg);color:var(--brand-primary);font-size:var(--fs-caption);font-weight:var(--fw-medium);border:var(--bw) solid var(--border)}
.fchip button{border:0;background:transparent;width:calc(var(--s-5));height:calc(var(--s-5));border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;color:var(--brand-primary)}
.fchip button:hover{background:var(--surface)}
.fchip button svg{width:var(--s-3);height:var(--s-3)}
.linkbtn{border:0;background:none;padding:var(--s-0);color:var(--link);font-size:var(--fs-caption);text-decoration:underline;text-underline-offset:var(--s-half)}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s-3) var(--s-6);margin-bottom:var(--s-4)}
.ph p{margin:var(--s-1) var(--s-0) var(--s-0);color:var(--text-muted);max-width:90ch}
.ph .acts{display:flex;flex-wrap:wrap;gap:var(--s-2)}

/* cards and grids */
.card{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-3);padding:var(--s-4);min-width:var(--s-0);box-shadow:var(--shadow-1)}
.card.flush{padding:var(--s-0)}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:var(--s-2) var(--s-4);margin-bottom:var(--s-3)}
.card.flush .card-h{padding:var(--s-4) var(--s-4) var(--s-0)}
.card-h h2{font-size:var(--fs-h3);font-weight:var(--fw-semibold)}
.card-h .sub{font-size:var(--fs-caption);color:var(--text-muted);margin-top:var(--s-half)}
.grid{display:grid;gap:var(--s-4)}
.g2{grid-template-columns:repeat(2,minmax(var(--s-0),1fr))}
.g3{grid-template-columns:repeat(3,minmax(var(--s-0),1fr))}
.g-main{grid-template-columns:minmax(var(--s-0),1.65fr) minmax(var(--s-0),1fr)}
@media (max-width:1100px){.g3,.g-main{grid-template-columns:minmax(var(--s-0),1fr)}}
@media (max-width:760px){.g2{grid-template-columns:minmax(var(--s-0),1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}

/* headline + KPIs */
.headline{font-family:var(--font-display);font-size:var(--fs-h2);line-height:var(--lh-h2);color:var(--brand-primary);margin:var(--s-0) var(--s-0) var(--s-4);max-width:100ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-16) * 2.4),1fr));gap:var(--s-px);background:var(--border);border:var(--bw) solid var(--border);border-radius:var(--r-3);overflow:hidden}
.kpi{background:var(--surface);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:var(--s-half);min-width:var(--s-0)}
.kpi-v{font-size:var(--fs-kpi);font-weight:var(--fw-medium);line-height:1.15;color:var(--text)}
.kpi-v small{font-size:var(--fs-small);color:var(--text-muted);font-weight:var(--fw-regular)}
.kpi .delta{font-size:var(--fs-caption);font-family:var(--font-num)}
.kpi .ctx{font-size:var(--fs-caption);color:var(--text-muted)}
a.kpi{text-decoration:none;color:inherit}
a.kpi:hover{background:var(--hover-bg)}

/* change list */
.chg{list-style:none;margin:var(--s-0);padding:var(--s-0);display:flex;flex-direction:column}
.chg li{display:grid;grid-template-columns:auto minmax(var(--s-0),1fr) auto;gap:var(--s-3);align-items:baseline;padding:var(--s-2) var(--s-0);border-bottom:var(--bw) solid var(--border);font-size:var(--fs-small)}
.chg li:last-child{border-bottom:0}
.chg .what{min-width:var(--s-0)}
.chg .v{font-family:var(--font-num);white-space:nowrap}
.empty{padding:var(--s-8) var(--s-4);text-align:center;color:var(--text-muted);font-size:var(--fs-small)}

/* ---------- table ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;padding:var(--s-3) var(--s-4);border-bottom:var(--bw) solid var(--border)}
.tbar .grow{flex:1}
.tbar select,.inp{font:inherit;font-size:var(--fs-small);height:var(--s-8);border:var(--bw) solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);color:var(--text);padding:var(--s-0) var(--s-2);min-width:var(--s-0)}
.inp{width:100%}
.tscroll{overflow:auto;max-height:calc(100vh - var(--header-h) - var(--s-16) * 2)}
table.grid-t{border-collapse:separate;border-spacing:var(--s-0);width:max-content;min-width:100%;font-size:var(--fs-small)}
.grid-t th,.grid-t td{padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);white-space:nowrap;background:var(--surface)}
.grid-t thead th{position:sticky;top:var(--s-0);z-index:3;font-weight:var(--fw-medium);color:var(--text-muted);font-size:var(--fs-caption);text-align:right;vertical-align:bottom;user-select:none}
.grid-t thead tr.grp th{top:var(--s-0);text-align:center;font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--brand-secondary);border-bottom:var(--bw-2) solid var(--brand-accent);padding:var(--s-1) var(--s-3)}
.grid-t thead tr.cols th{top:calc(var(--s-6) + var(--s-half))}
.grid-t thead th.sortable{cursor:pointer}
.grid-t thead th.sortable:hover{color:var(--text)}
.grid-t thead th[aria-sort]{color:var(--brand-primary)}
.grid-t .sortk{font-family:var(--font-num);font-size:var(--fs-micro);margin-left:var(--s-half)}
.grid-t td{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.grid-t th.l,.grid-t td.l{text-align:left;font-family:var(--font-body)}
.grid-t .stk{position:sticky;left:var(--s-0);z-index:2;box-shadow:inset calc(var(--bw) * -1) 0 0 var(--border)}
.grid-t thead .stk{z-index:4}
.grid-t tbody tr{cursor:pointer}
.grid-t tbody tr:hover td{background:var(--hover-bg)}
.grid-t tbody tr.sel td{background:var(--select-bg)}
.grid-t td.first{min-width:calc(var(--s-16) * 4.4);max-width:calc(var(--s-16) * 5.2);white-space:normal}
.cname{font-weight:var(--fw-semibold);color:var(--text);display:block;line-height:1.3}
.cmeta{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);margin-top:var(--s-1);font-size:var(--fs-micro);color:var(--text-muted)}
.grid-t td.desc{white-space:normal;min-width:calc(var(--s-16) * 4.5);max-width:calc(var(--s-16) * 6);color:var(--text-muted);font-size:var(--fs-caption);font-family:var(--font-body);text-align:left}
.grid-t .gstart{border-left:var(--bw) solid var(--border)}
.heat-p1{background:var(--div-p1)!important} .heat-p2{background:var(--div-p1)!important;box-shadow:inset 0 calc(var(--bw-3) * -1) 0 var(--div-p2)}
.heat-n1{background:var(--div-n1)!important} .heat-n2{background:var(--div-n1)!important;box-shadow:inset 0 calc(var(--bw-3) * -1) 0 var(--div-n2)}
.nm{color:var(--text-subtle);border-bottom:var(--bw) dotted var(--text-subtle);cursor:help}
.spark{display:inline-block;vertical-align:middle}
.mandate-edge td.first{box-shadow:inset var(--bw-3) 0 0 var(--brand-secondary), inset calc(var(--bw) * -1) 0 0 var(--border)}

/* popover / menus */
.pop{position:absolute;z-index:var(--z-modal);background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-3);box-shadow:var(--shadow-2);padding:var(--s-3);min-width:calc(var(--s-16) * 4);max-height:70vh;overflow:auto}
.pop h4{margin:var(--s-2) var(--s-0) var(--s-1);font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.chk{display:flex;align-items:center;gap:var(--s-2);font-size:var(--fs-small);padding:var(--s-1) var(--s-0);cursor:pointer}
.chk input{accent-color:var(--brand-secondary);width:var(--icon);height:var(--icon);margin:var(--s-0)}

/* filter panel */
.fpanel{display:flex;flex-direction:column;gap:var(--s-4)}
.fgrp{display:flex;flex-direction:column;gap:var(--s-2)}
.fgrp > .eyebrow{display:block}
.rng{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s-1);align-items:center}
.rng span{color:var(--text-subtle);font-size:var(--fs-caption)}
.rlab{display:flex;justify-content:space-between;gap:var(--s-2);font-size:var(--fs-small)}
.rlab em{font-style:normal;color:var(--text-subtle);font-family:var(--font-num);font-size:var(--fs-micro)}
.gchip{display:inline-flex;align-items:center;gap:var(--s-1);border:var(--bw) solid var(--border);border-radius:var(--r-pill);padding:var(--s-half) var(--s-2);font-size:var(--fs-caption);background:var(--surface);text-align:left;line-height:1.3}
.gchip .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.gchip .n{font-family:var(--font-num);color:var(--text-subtle);font-size:var(--fs-micro)}
.gchip[aria-pressed=true]{background:var(--select-bg);border-color:var(--brand-secondary);color:var(--brand-primary)}
.scr-layout{display:grid;grid-template-columns:calc(var(--s-16) * 4) minmax(var(--s-0),1fr);gap:var(--s-4);align-items:start}
.scr-layout > .card:first-child{position:sticky;top:calc(var(--header-h) + var(--s-4));max-height:calc(100vh - var(--header-h) - var(--s-8));overflow:auto}
@media (max-width:1100px){.scr-layout{grid-template-columns:minmax(var(--s-0),1fr)}.scr-layout > .card:first-child{position:static;max-height:none}}
details.fold > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:var(--fw-semibold)}
details.fold > summary::-webkit-details-marker{display:none}
@media (min-width:1101px){ details.fold > summary{display:none} }

/* company page */
.co-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s-3) var(--s-6);align-items:flex-start;margin-bottom:var(--s-4)}
.co-h .meta{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-top:var(--s-2);font-size:var(--fs-small);color:var(--text-muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s-1) var(--s-4);margin:var(--s-0);font-size:var(--fs-small)}
.kv dt{color:var(--text-muted)} .kv dd{margin:var(--s-0);text-align:right;font-family:var(--font-num)}
.notes{margin:var(--s-0);padding-left:var(--s-4);display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-small)}
.notes li::marker{color:var(--brand-accent)}
.srcs{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-3);font-size:var(--fs-caption)}
.calc{display:grid;gap:var(--s-3)}
.calc input[type=range]{width:100%;accent-color:var(--brand-secondary)}
.calc .out{display:grid;grid-template-columns:repeat(3,minmax(var(--s-0),1fr));gap:var(--s-px);background:var(--border);border-radius:var(--r-2);overflow:hidden}
.calc .out div{background:var(--surface-sunk);padding:var(--s-2) var(--s-3)}
.calc .out b{display:block;font-family:var(--font-num);font-size:var(--fs-h2);font-weight:var(--fw-medium)}
.dq{list-style:none;margin:var(--s-0);padding:var(--s-0);display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-small)}
.dq li{display:flex;gap:var(--s-2);align-items:baseline}
.pn{display:flex;gap:var(--s-2)}

/* shortlist + compare */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--s-16) * 5),1fr));gap:var(--s-4)}
.scard{display:flex;flex-direction:column;gap:var(--s-3)}
.scard .top{display:flex;justify-content:space-between;gap:var(--s-2);align-items:flex-start}
.scard .rank{font-family:var(--font-num);font-size:var(--fs-h2);color:var(--brand-accent);font-weight:var(--fw-bold)}
.scard .thesis{margin:var(--s-0);font-size:var(--fs-small)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(var(--s-0),1fr));gap:var(--s-px);background:var(--border);border-radius:var(--r-2);overflow:hidden}
.mini div{background:var(--surface-sunk);padding:var(--s-1) var(--s-2);font-size:var(--fs-micro);color:var(--text-muted)}
.mini b{display:block;font-family:var(--font-num);font-size:var(--fs-small);color:var(--text);font-weight:var(--fw-medium)}
.wts{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-16) * 3),1fr));gap:var(--s-2) var(--s-5)}
.wt{display:grid;grid-template-columns:1fr auto;gap:var(--s-1) var(--s-2);font-size:var(--fs-small);align-items:center}
.wt input{grid-column:1/-1;width:100%;accent-color:var(--brand-secondary)}
.wt b{font-family:var(--font-num)}
table.cmp{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
.cmp th,.cmp td{padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);text-align:right;vertical-align:top}
.cmp th.l,.cmp td.l{text-align:left}
.cmp thead th{font-weight:var(--fw-semibold);color:var(--brand-primary);vertical-align:bottom}
.cmp tr.sec td{background:var(--surface-sunk);font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--brand-secondary);font-weight:var(--fw-semibold);text-align:left}
.cmp td.best{background:var(--positive-bg);color:var(--positive);font-weight:var(--fw-semibold)}
.cmp td.worst{background:var(--negative-bg);color:var(--negative)}
.cmp td{font-family:var(--font-num)}
.cmp td.l,.cmp td.note{font-family:var(--font-body)}
.cmp td.note{text-align:left;white-space:normal;font-size:var(--fs-caption);color:var(--text-muted)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:var(--s-2)}
.fstage{display:grid;grid-template-columns:minmax(var(--s-0),1fr) auto;gap:var(--s-1) var(--s-3);text-decoration:none;color:inherit;padding:var(--s-2);border-radius:var(--r-2)}
.fstage:hover{background:var(--hover-bg)}
.fstage .bar{grid-column:1/-1;height:var(--s-3);background:var(--surface-sunk);border-radius:var(--r-1);overflow:hidden}
.fstage .bar i{display:block;height:100%;background:var(--brand-secondary);border-radius:var(--r-1)}
.fstage b{font-family:var(--font-num);font-size:var(--fs-h2);font-weight:var(--fw-medium)}
.fstage .l{font-size:var(--fs-small);font-weight:var(--fw-medium)}
.fstage .d{font-size:var(--fs-caption);color:var(--text-muted)}

/* search modal */
.modal{position:fixed;inset:var(--s-0);z-index:var(--z-modal);background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.modal[hidden]{display:none}
.sbox{width:min(calc(var(--s-16) * 10), 92vw);background:var(--surface);border-radius:var(--r-3);box-shadow:var(--shadow-2);overflow:hidden}
.sbox input{width:100%;border:0;border-bottom:var(--bw) solid var(--border);padding:var(--s-4);font:inherit;font-size:var(--fs-h2);outline:none}
.sres{list-style:none;margin:var(--s-0);padding:var(--s-2);max-height:55vh;overflow:auto}
.sres li a{display:flex;justify-content:space-between;gap:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);text-decoration:none;color:var(--text)}
.sres li a[aria-selected=true],.sres li a:hover{background:var(--select-bg)}
.sres .k{font-size:var(--fs-caption);color:var(--text-muted)}
.sres mark{background:var(--warning-bg);color:inherit}

/* tooltip + toast */
.tip{position:fixed;z-index:var(--z-tip);pointer-events:none;background:var(--n-900);color:var(--n-0);font-size:var(--fs-caption);line-height:1.4;padding:var(--s-2) var(--s-3);border-radius:var(--r-2);max-width:calc(var(--s-16) * 5);box-shadow:var(--shadow-2)}
.tip[hidden]{display:none}
.tip b{font-weight:var(--fw-semibold)}
.toast{position:fixed;left:50%;bottom:var(--s-6);transform:translateX(-50%);z-index:var(--z-tip);background:var(--n-900);color:var(--n-0);padding:var(--s-2) var(--s-4);border-radius:var(--r-2);font-size:var(--fs-small)}
.toast[hidden]{display:none}
[data-tip]{cursor:help}
th[data-tip]{cursor:pointer}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font-num);font-size:var(--fs-micro);fill:var(--text-muted)}
.chart .ttl{font-family:var(--font-body)}
.chart .lbl{fill:var(--text);font-weight:var(--fw-medium)}
.chart .lbl-strong{fill:var(--brand-primary);font-weight:var(--fw-semibold);font-family:var(--font-body)}
.chart .halo{stroke:var(--surface);stroke-width:var(--bw-3);paint-order:stroke;stroke-linejoin:round}
.chart .grid{stroke:var(--viz-grid);stroke-width:var(--bw)}
.chart .axis{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart .zero{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart .med{stroke:var(--viz-median);stroke-width:var(--bw);stroke-dasharray:4 3}
.chart .band{fill:var(--viz-band)}
.chart .bandt{fill:var(--brand-secondary);font-family:var(--font-body);font-weight:var(--fw-semibold)}
.chart .mk{stroke:var(--surface);stroke-width:var(--bw);transition:opacity var(--dur-1)}
.chart .mk.faded{opacity:.28}
.chart .mk.out{fill-opacity:.35}
.chart .mk.hl{stroke:var(--brand-primary);stroke-width:var(--bw-2)}
.chart .leader{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart [data-s]{transition:opacity var(--dur-1)}
.chart.hovering [data-s]:not(.on){opacity:.18}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-3);margin-top:var(--s-2);font-size:var(--fs-caption);color:var(--text-muted)}
.legend button{display:inline-flex;align-items:center;gap:var(--s-1);border:0;background:none;padding:var(--s-half) var(--s-1);border-radius:var(--r-1);color:inherit}
.legend button:hover{background:var(--hover-bg)}
.legend button[aria-pressed=false]{opacity:.4}
.legend svg{width:var(--s-3);height:var(--s-3)}
.legend .note{color:var(--text-subtle)}
.ch-anim .grow{transform-box:fill-box;transform-origin:bottom;animation:ch-grow var(--dur-3) var(--ease) both}
.ch-anim .growx{transform-box:fill-box;transform-origin:left;animation:ch-growx var(--dur-3) var(--ease) both}
.ch-anim .fade{animation:ch-fade var(--dur-2) var(--ease) backwards}
@keyframes ch-grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes ch-growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes ch-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .ch-anim .grow,.ch-anim .growx,.ch-anim .fade{animation:none} *{transition:none!important} }
.hbar{display:flex;height:var(--s-5);border-radius:var(--r-1);overflow:hidden;background:var(--surface-sunk)}
.hbar i{display:block;height:100%}
.gallery-item{border-top:var(--bw) solid var(--border);padding-top:var(--s-4)}
.axes{display:flex;gap:var(--s-2);align-items:center;font-size:var(--fs-caption);color:var(--text-muted)}
.axes select{font:inherit;font-size:var(--fs-caption);height:calc(var(--s-6) + var(--s-1));border:var(--bw) solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);color:var(--text);max-width:calc(var(--s-16) * 2.6)}

/* methodology */
.defs{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.defs th,.defs td{text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);vertical-align:top}
.defs th{color:var(--text-muted);font-weight:var(--fw-medium);font-size:var(--fs-caption)}
.prose{max-width:85ch;font-size:var(--fs-small)}
.prose p{margin:var(--s-0) var(--s-0) var(--s-3)}

/* ---------- print: IC pack (16:9) ---------- */
#pack{display:none}
body.printing.pack-preview > *:not(#pack):not(.tip){display:none!important} body.printing.pack-preview{background:var(--n-200)} body.printing.pack-preview #pack{display:block}
@page{size:13.333in 7.5in;margin:0}
@media print{
  body{background:var(--surface)}
  body.printing > *:not(#pack){display:none!important}
  body.printing #pack{display:block}
  body.print-compare .hdr, body.print-compare .side, body.print-compare .chipbar, body.print-compare .noprint{display:none!important}
  body.print-compare .shell{display:block}
  body.print-compare .main{padding:var(--s-0);max-width:none}
  .card{box-shadow:none}
}
.slide{width:13.333in;height:7.5in;position:relative;overflow:hidden;background:var(--surface);page-break-after:always;break-after:page;display:flex;flex-direction:column}
.slide:last-child{page-break-after:auto;break-after:auto}
.slide .sh{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--s-8) var(--s-3);border-bottom:var(--bw-2) solid var(--brand-primary);flex:none}
.slide .sh img{height:var(--s-6);width:auto}
.slide .sh h2{font-family:var(--font-display);color:var(--brand-primary);font-size:var(--fs-h1);font-weight:var(--fw-bold)}
.slide .sh .sec{margin-left:auto;font-size:var(--fs-caption);color:var(--text-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.slide .sb{flex:1;position:relative;overflow:hidden;padding:var(--s-4) var(--s-8)}
.slide .sb > .fit{transform-origin:top left;width:100%}
.slide .sf{display:flex;justify-content:space-between;gap:var(--s-4);padding:var(--s-2) var(--s-8);border-top:var(--bw) solid var(--border);font-size:var(--fs-micro);color:var(--text-muted);flex:none}
.slide.cover{background:var(--brand-primary);color:var(--text-on-brand);justify-content:center;padding:var(--s-0) var(--s-16)}
.slide.cover img{height:var(--s-12);width:auto;align-self:flex-start;margin-bottom:var(--s-12)}
.slide.cover h1{font-family:var(--font-display);color:var(--text-on-brand);font-size:var(--fs-display);margin-bottom:var(--s-3)}
.slide.cover p{margin:var(--s-0);color:var(--brand-accent);font-size:var(--fs-h2)}
.slide.cover .conf-big{margin-top:var(--s-12);border:var(--bw) solid var(--brand-accent);color:var(--brand-accent);align-self:flex-start;padding:var(--s-1) var(--s-3);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-size:var(--fs-caption);border-radius:var(--r-1)}
.slide .tscroll{max-height:none;overflow:visible}
.slide .card{box-shadow:none}
.slide .cmp th,.slide .cmp td{padding:var(--s-1) var(--s-3)}
.slide .cmp td.l{white-space:nowrap}
.slide table.grid-t{width:100%}
.slide .grid-t td.first{max-width:none}
</style>

<script>/* Greater Pacific dashboard kit — charts. The single chart library for every dashboard (SVG, no dependencies).

(function(){

const SHAPES = ["circle","square","triangle","diamond","tdown","cross","wye","star"];
function shapePath(kind, x, y, r){
  const p = (a)=>a.map((q,i)=>(i?"L":"M")+(x+q[0]).toFixed(1)+" "+(y+q[1]).toFixed(1)).join("")+"Z";
  switch(kind){
    case "square":  return p([[-r*.88,-r*.88],[r*.88,-r*.88],[r*.88,r*.88],[-r*.88,r*.88]]);
    case "triangle":return p([[0,-r*1.15],[r*1.05,r*.75],[-r*1.05,r*.75]]);
    case "tdown":   return p([[0,r*1.15],[r*1.05,-r*.75],[-r*1.05,-r*.75]]);
    case "diamond": return p([[0,-r*1.2],[r*1.05,0],[0,r*1.2],[-r*1.05,0]]);
    case "cross":   { const a=r*.38, b=r*1.05; return p([[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]]); }

    case "star":    { const pts=[]; for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.5:r*1.2; pts.push([Math.cos(ang)*rr,Math.sin(ang)*rr]); } return p(pts); }

function niceTicks(lo, hi, n=5){

/* Greater Pacific dashboard kit — data-layer helpers shared by every adapter.
   Adapters (src/<dashboard>/adapter.js) turn the generated data files into one MODEL object.
   All derived figures are computed here or in the adapter, never in UI code. */
(function(){
const median = a=>{ a=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); if(!a.length) return null; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; };
const slug = s=>String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
function uniqueSlugs(names){ const seen={}; return names.map(n=>{ let s=slug(n)||"company"; if(seen[s]){ seen[s]++; s=s+"-"+seen[s]; } else seen[s]=1; return s; }); }
/** YoY growth %; returns {v, nm} where nm is a reason string when growth is not meaningful. */
function growth(cur, prev, minBase){
  if(cur==null||prev==null) return {v:null, nm:null};
  if(prev<=0) return {v:null, nm:`Prior-year value is ${prev<0?"negative":"zero"}, so growth is not meaningful.`};
  if(minBase!=null && prev<minBase) return {v:null, nm:`Prior-year value ₹${prev} cr is below the ₹${minBase} cr base threshold, so growth is not meaningful.`};
  return {v:(cur-prev)/Math.abs(prev)*100, nm:null};
}
/** n-year CAGR %; nm when either end is non-positive or start is below the base threshold. */
function cagr(end, start, years, minBase){
  if(end==null||start==null) return {v:null, nm:null};
  if(start<=0||end<=0) return {v:null, nm:"CAGR needs positive values at both ends."};
  if(minBase!=null && start<minBase) return {v:null, nm:`Start value ₹${start} cr is below the ₹${minBase} cr base threshold, so CAGR is not meaningful.`};
  return {v:(Math.pow(end/start,1/years)-1)*100, nm:null};
}
/** Percentile rank 0..1 of v within values (ties averaged); null if v missing. */
function pctRank(values, v, lowerIsBetter){
  if(v==null||!isFinite(v)) return null;
  const a=values.filter(x=>x!=null&&isFinite(x)); if(a.length<2) return .5;
  const below=a.filter(x=>x<v).length, eq=a.filter(x=>x===v).length;
  const p=(below+(eq-1)/2)/(a.length-1);
  return lowerIsBetter?1-p:p;

function parseAsof(s){
  if(!s) return null;
  const m=String(s).match(/(\d{1,2}) (\w{3})\w* (\d{4})(?:,? (\d{1,2}):(\d{2}))?(?:\s*(IST))?/);
  if(!m) { const d=new Date(s); return isNaN(d)?null:d; }
  const mon=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[2].toLowerCase());
  const hh=+(m[4]||0), mm=+(m[5]||0);
  // IST is UTC+5:30; strings without a zone are treated as IST (all sources are Indian).
  return new Date(Date.UTC(+m[3], mon, +m[1], hh, mm) - 330*60000);
}
/** Snapshot diff between two models built by the same adapter. rules: {pct:[{k,th,label}], abs:[{k,th,label,unit}], any:[{k,label}], text:[{k,label}], flags:[keys]} */
function diff(cur, prev, rules){
  if(!prev) return null;
  const out=[], P=new Map(prev.companies.map(c=>[c.name,c])), C=new Map(cur.companies.map(c=>[c.name,c]));
  const r1=v=>v==null?"–":(+v).toLocaleString("en-IN",{maximumFractionDigits:2});
  for(const c of cur.companies){
    const p=P.get(c.name);
    if(!p){ out.push({id:c.id,name:c.name,kind:"added",tone:"info",text:"Added to the list"}); continue; }
    (rules.pct||[]).forEach(r=>{ const a=p.m[r.k], b=c.m[r.k]; if(a>0&&b!=null){ const ch=(b-a)/a*100; if(Math.abs(ch)>=r.th) out.push({id:c.id,name:c.name,kind:r.k,tone:ch>0?"pos":"neg",text:`${r.label} ${ch>0?"up":"down"} ${Math.abs(ch).toFixed(1)}%`,value:`${r1(a)} → ${r1(b)}`}); } });
    (rules.abs||[]).forEach(r=>{ const a=p.m[r.k], b=c.m[r.k]; if(a!=null&&b!=null&&Math.abs(b-a)>=r.th) out.push({id:c.id,name:c.name,kind:r.k,tone:"info",text:`${r.label} ${b>a?"rose":"fell"} ${Math.abs(b-a).toFixed(2)}${r.unit||""}`,value:`${r1(a)}${r.unit||""} → ${r1(b)}${r.unit||""}`}); else if((a==null)!==(b==null)) out.push({id:c.id,name:c.name,kind:r.k,tone:"warn",text:`${r.label} ${b==null?"no longer reported":"now reported"}`,value:`${r1(a)} → ${r1(b)}`}); });
    (rules.any||[]).forEach(r=>{ const a=p.m[r.k], b=c.m[r.k]; if(a!==b && !(a==null&&b==null)) out.push({id:c.id,name:c.name,kind:r.k,tone:"info",text:`${r.label} changed`,value:`${r1(a)} → ${r1(b)}`}); });
    (rules.text||[]).forEach(r=>{ if((p[r.k]||"")!==(c[r.k]||"")) out.push({id:c.id,name:c.name,kind:r.k,tone:"info",text:`${r.label} changed`,value:`${p[r.k]||"–"} → ${c[r.k]||"–"}`}); });
    const pf=new Set(p.flags.map(f=>f.key)), cf=new Set(c.flags.map(f=>f.key));
    (rules.flags||[]).forEach(k=>{ const lab=(c.flags.find(f=>f.key===k)||p.flags.find(f=>f.key===k)||{}).label||k;
      if(cf.has(k)&&!pf.has(k)) out.push({id:c.id,name:c.name,kind:"flag",tone:k==="mandate"||k==="evaluated"?"pos":"warn",text:k==="mandate"?"Entered the mandate":`New flag: ${lab}`});
      if(!cf.has(k)&&pf.has(k)) out.push({id:c.id,name:c.name,kind:"flag",tone:k==="mandate"?"neg":"pos",text:k==="mandate"?"Left the mandate":`Flag cleared: ${lab}`}); });
    if(c.shortlisted!==p.shortlisted) out.push({id:c.id,name:c.name,kind:"short",tone:"info",text:c.shortlisted?"Added to the shortlist":"Removed from the shortlist"});
  }
  for(const p of prev.companies){ if(!C.has(p.name)) out.push({id:null,name:p.name,kind:"removed",tone:"warn",text:"Removed from the list"}); }
  (cur.failed||[]).forEach(t=>{ const c=cur.companies.find(x=>x.code===t); out.push({id:c?c.id:null,name:c?c.name:t,kind:"failed",tone:"neg",text:"Market refresh failed"}); });
  return out;
}
window.Kit = { median, slug, uniqueSlugs, growth, cagr, pctRank, parseAsof, diff };
})();

    const ce=new DataView(new ArrayBuffer(46)); ce.setUint32(0,0x02014b50,true); ce.setUint16(4,20,true); ce.setUint16(6,20,true); ce.setUint32(16,c,true); ce.setUint32(20,data.length,true); ce.setUint32(24,data.length,true); ce.setUint16(28,nb.length,true); ce.setUint32(42,off,true);
    cen.push(new Uint8Array(ce.buffer),nb); off+=30+nb.length+data.length;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function build(rows, sheetName){
  const sd=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{ const ref=col(ci)+(ri+1), st=ri===0?' s="1"':'';
    if(typeof v==="number"&&isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
    if(v==null||v==="") return "";
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`; }).join("")+`</row>`).join("");
  const files=[
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x((sheetName||"Sheet1").slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>`],

<script>/* Listed FS screener — adapter. Turns data.js + market.js + diligence.js + shortlist.js into the kit MODEL.
   Merge rules are unchanged from the previous dashboard (see comments); no figure is altered here. */
(function(){
const K = window.Kit;
const MIN_BASE = 2; // ₹ cr: growth off a smaller prior-year base is shown as n.m.
const MANDATE = {lo:40, hi:130, pat:5};
const VERTS = [
  ["NBFC - Lending & Investment","NBFC lending"],
  ["Investment Banking & Advisory","IB & advisory"],
  ["Stock & Commodity Broking","Broking"],
  ["Fintech / Digital Lending & Payments","Fintech & payments"],
  ["Financial Products Distribution","Distribution"],
  ["Forex & Remittance Services","Forex & remittance"],
  ["Asset/Equipment Finance","Asset finance"],
  ["Other / Diversified","Other / diversified"]
];
const PART = {brk:"Broking",dist:"Distribution",ib:"IB & advisory",int:"Interest / lending",trd:"Trading",oth:"Other"};
const PART_ORDER = ["brk","dist","ib","int","trd","oth"];
const TONE = {g:"pos",w:"warn",b:"neg",n:"neu"};

function merge(src){
  const MKT = src.MKT || {asof:null, co:{}};
  const MKT_KEYS = ["mc","pe","pb","r24","r25","r26","p24","p25","p26","pr","fii","dii","rt","gd"];
  return (src.RAW_BASE||[]).map(r=>{
    const m = MKT.co && MKT.co[r.t]; if(!m) return {...r, _mkt:false};
    const o = {...r, _mkt:true, price:m.price, shq:m.shq, basis:m.basis};
    // Screener rounds figures above ~₹100 cr (and many FY totals) to whole crores; keep the more precise base value when it rounds to the same number.
    MKT_KEYS.forEach(k=>{ if(m[k]==null) return; if(k!=="mc" && Number.isInteger(m[k]) && r[k]!=null && Math.abs(r[k]-m[k])<1) return; o[k]=m[k]; });
    // Borrowings: Screener's figure folds in leases; keep the audited figure in data.js whenever one is recorded.
    if(r.gd!=null) o.gd=r.gd;
    if(m.fii!=null || m.dii!=null) o.inst = +((o.fii||0)+(o.dii||0)).toFixed(2);
    if(o.gd!=null && r.cash!=null) o.nd = +(o.gd - r.cash).toFixed(2);
    return o;
  });
}

function build(src, opts){
  opts = opts||{};
  const MKT = src.MKT || {asof:null, co:{}, failed:[]};
  const DD = (src.DD||[]).slice().sort((a,b)=>a.rank-b.rank);
  const DDM = src.DD_META || {};
  const SL = src.SHORTLIST || {names:[], notes:{}};
  const rows = merge(src);
  const ids = K.uniqueSlugs(rows.map(r=>r.n));
  const shortNames = new Set(SL.names||[]);
  const failed = new Set((MKT.failed||[]).map(f=>typeof f==="string"?f:(f.t||f.ticker||f.n)));
  const vkey = full => VERTS.findIndex(v=>v[0]===full);

  const companies = rows.map((r,i)=>{
    const [ex,tk] = String(r.t||":").split(":");
    const rg=K.growth(r.r26,r.r25,MIN_BASE), pg=K.growth(r.p26,r.p25,MIN_BASE), rg3=K.cagr(r.r26,r.r24,2,MIN_BASE), pg3=K.cagr(r.p26,r.p24,2,MIN_BASE);
    const ctrlPct = r.pr==null?null:Math.min(100,r.pr+26);
    const groups = (r.v||[]).map(v=>({key:String(Math.max(0,vkey(v[0]))), pct:v[1]}));
    const prim = (r.v||[]).slice().sort((a,b)=>(b[1]??-1)-(a[1]??-1))[0]?.[0] || "Other / Diversified";
    const dd = DD.find(x=>x.n===r.n) || null;
    const m = { mc:r.mc, price:r.price??null, r24:r.r24, r25:r.r25, r26:r.r26, p24:r.p24, p25:r.p25, p26:r.p26,
      rg:rg.v, pg:pg.v, rg3:rg3.v, pg3:pg3.v,
      pm: r.r26 ? r.p26/r.r26*100 : null,
      pe:r.pe, pb:r.pb, roe:(r.pb&&r.pe)? r.pb/r.pe*100 : null,
      pr:r.pr, fii:r.fii, dii:r.dii, rt:r.rt, inst:r.inst??null,
      gd:r.gd, cash:r.cash, nd:r.nd??null,
      ndmc: (r.nd!=null&&r.mc)? r.nd/r.mc*100 : null,
      ctrl: ctrlPct==null||r.mc==null?null:r.mc*ctrlPct/100 };
    const nm = {rg:rg.nm, pg:pg.nm, rg3:rg3.nm, pg3:pg3.nm};
    const fit = r.mc>=MANDATE.lo && r.mc<=MANDATE.hi && r.p26>=MANDATE.pat;
    const review = !!r.rv || /flagged for review/i.test(r.ev||"");
    const oddPE = r.pe!=null && r.pe<2;
    const flags = [];
    if(fit) flags.push({key:"mandate",label:"Mandate",tone:"info",tip:`Market cap ₹${MANDATE.lo}–${MANDATE.hi} cr and FY26 PAT ≥ ₹${MANDATE.pat} cr.`});
    if(dd) flags.push({key:"diligence",label:"Diligence",tone:"brand",tip:`Shortlist diligence on file (as of ${DDM.asof||"n/a"}).`});
    if(review) flags.push({key:"review",label:"Review",tone:"warn",tip:"Vertical classification flagged for review in the source workbook."});
    if(oddPE) flags.push({key:"checkpat",label:"Check PAT",tone:"warn",tip:"P/E below 2x: FY26 PAT likely includes one-offs or associate income."});
    if(!(r.pr>0)) flags.push({key:"nopromoter",label:"No promoter",tone:"warn",tip:"No promoter shareholding is reported."});
    const dq = [];
    if(failed.has(r.t)) dq.push({level:"neg",text:"Latest market refresh failed for this company; market figures are from the previous refresh."});
    if(!r._mkt) dq.push({level:"warn",text:"No Screener refresh for this ticker; all figures are from the workbook."});
    if(review) dq.push({level:"warn",text:"Vertical classification flagged for review in the source."});
    if(oddPE) dq.push({level:"warn",text:`P/E of ${r.pe}x looks too low for an operating business; check FY26 PAT for one-offs.`});
    if(r.cash==null) dq.push({level:"info",text:"Cash not recorded, so net debt cannot be computed."});
    ["mc","pe","pb","r26","p26","pr"].forEach(k=>{ if(r[k]==null) dq.push({level:"info",text:`${k.toUpperCase()} missing in the source.`}); });
    Object.entries(nm).forEach(([k,v])=>{ if(v) dq.push({level:"info",text:`${({rg:"Revenue growth",pg:"PAT growth",rg3:"Revenue CAGR",pg3:"PAT CAGR"})[k]}: ${v}`}); });
    if(r.basis==="standalone") dq.push({level:"info",text:"Screener has no consolidated figures; standalone figures shown."});
    if(r.p26!=null&&r.r26!=null&&r.p26>r.r26) dq.push({level:"warn",text:"FY26 PAT exceeds FY26 revenue: check for other income or a data error."});
    const notes = SL.notes && SL.notes[r.n] || {};
    return {
      id:ids[i], name:r.n, ticker:tk||"", exchange:ex==="NSEI"?"NSE":ex||"", code:r.t,
      groups, prim:String(Math.max(0,vkey(prim))), desc:r.ev||"", seg:r.seg||"",
      m, nm, flags, fit, dq,
      shortlisted: shortNames.has(r.n),
      verdict: dd? {label:dd.verdict[0], tone:TONE[dd.verdict[1]]||"neu"} : (notes.verdict? {label:notes.verdict, tone:"neu"} : null),
      thesis: dd? dd.line : (notes.thesis||""),
      updated: dd? (DDM.asof||null) : (notes.updated||SL.updated||null),
      open: dd? dd.dd||[] : [],
      dd,
      hold: {asof:r.shq||null, parts:[{label:"Promoter",value:r.pr},{label:"FII",value:r.fii},{label:"DII",value:r.dii},{label:"Public",value:r.rt}]},
      revMix: dd&&dd.rev? {total:dd.rev.total, source:dd.rev.conf?dd.rev.conf[1]:"", conf:dd.rev.conf?dd.rev.conf[0]:"", note:dd.rev.note||"",
        parts: dd.rev.parts.slice().sort((a,b)=>PART_ORDER.indexOf(a[0])-PART_ORDER.indexOf(b[0])).map(p=>({key:p[0], label:PART[p[0]]||p[0], detail:p[1], value:p[2]}))} : null,
      contacts:(r.li||[]).map(u=>({label:u.replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//,"").replace(/[\/?].*$/,""), url:u})),
      sources: dd? dd.src.map(s=>({label:s[0],url:s[1],date:DDM.asof||""})) : [],
      fin:{cats:["FY24","FY25","FY26"], rev:[r.r24,r.r25,r.r26], pat:[r.p24,r.p25,r.p26]}
    };
  });

  const asofStr = MKT.asof || null;
  return {
    key:"fs",
    product:"Listed FS Platform Screener",
    subtitle:"Small-cap listed Indian financial services · consolidated FY24–FY26",
    asof: asofStr, asofDate: K.parseAsof(asofStr), staleAfterHours: 30,
    asofNote:"Market data refresh from Screener.in, weekdays 4 PM IST",
    failed:[...failed],
    repo: DDM.repo || "project4-gpc/listed-fs-dashboard", shortlistFile:"shortlist.js",
    shortlistMeta: SL,
    groupLabel:"Vertical", groupLabelPlural:"Verticals", multiGroup:true,
    groups: VERTS.map((v,i)=>({key:String(i), label:v[0], short:v[1], color:`var(--viz-${i+1})`, shape:window.Charts.SHAPES[i], n:companies.filter(c=>c.groups.some(g=>g.key===String(i))).length})),
    companies,
    minBase: MIN_BASE,
    mandate:{metric:"mc", lo:MANDATE.lo, hi:MANDATE.hi, label:`Mandate ₹${MANDATE.lo}–${MANDATE.hi} cr`, desc:`Market cap ₹${MANDATE.lo}–${MANDATE.hi} cr and FY26 PAT ≥ ₹${MANDATE.pat} cr`},
    metrics: METRICS(asofStr, DDM.asof),
    columnGroups:["Size","Valuation","Growth","Profitability","Ownership","Control"],
    views:[
      {key:"default",label:"Default",cols:["mc","r26","p26","pe","pb","roe","rg","pg","pg3","sRev","sPat","pm","pr","inst","nd","ctrl"]},
      {key:"valuation",label:"Valuation",cols:["mc","pe","pb","roe","p26","pm","pr","ctrl"]},
      {key:"growth",label:"Growth",cols:["mc","r24","r25","r26","rg","rg3","sRev","p24","p25","p26","pg","pg3","sPat"]},
      {key:"ownership",label:"Ownership & control",cols:["mc","pr","fii","dii","inst","rt","gd","cash","nd","ctrl"]},
      {key:"all",label:"All columns",cols:["mc","price","r24","r25","r26","p24","p25","p26","pe","pb","roe","rg","rg3","sRev","pg","pg3","sPat","pm","pr","fii","dii","inst","rt","gd","cash","nd","ndmc","ctrl"]}
    ],
    filters:{
      ranges:["mc","p26","r26","pe","pb","pr","inst","nd"],
      toggles:[
        {key:"fit",label:"Mandate fit",test:c=>c.fit},
        {key:"short",label:"Shortlisted",test:c=>c.shortlisted},
        {key:"netcash",label:"Net cash (net debt ≤ 0)",test:c=>c.m.nd!=null&&c.m.nd<=0},
        {key:"patup",label:"FY26 PAT above FY25",test:c=>c.m.p26>c.m.p25},
        {key:"prom",label:"Has a promoter",test:c=>c.m.pr>0},
        {key:"prom50",label:"Promoter ≥ 50%",test:c=>c.m.pr>=50},
        {key:"nse",label:"Listed on NSE",test:c=>c.exchange==="NSE"},
        {key:"multi",label:"Multi-vertical",test:c=>c.groups.length>1}
      ]
    },
    presets:[
      {key:"mandate",label:"Mandate fit",desc:"Market cap ₹40–130 cr and FY26 PAT ≥ ₹5 cr",state:{t:["fit"]}},
      {key:"clean",label:"Clean & controllable",desc:"Mandate fit, promoter ≥ 50%, net cash",state:{t:["fit","prom50","netcash"]}},
      {key:"growth",label:"Profit growers",desc:"FY26 PAT ≥ ₹5 cr and above FY25",state:{r:{p26:[5,null]},t:["patup"],s:["-pg"]}}
    ],
    funnel:[
      {label:"Universe",desc:"All screened companies",state:{}},
      {label:"Mandate fit",desc:"Market cap ₹40–130 cr, FY26 PAT ≥ ₹5 cr",state:{t:["fit"]}},
      {label:"Clean & controllable",desc:"…and promoter ≥ 50%, net cash",state:{t:["fit","prom50","netcash"]}},
      {label:"Shortlist",desc:"On the team shortlist (shortlist.js)",state:{t:["short"]}}
    ],
    kpis:[
      {key:"universe",label:"Universe",fmt:"int",value:cs=>cs.length,ctx:cs=>`${new Set(cs.map(c=>c.prim)).size} verticals`,link:{}},
      {key:"fit",label:"Mandate fit",fmt:"int",value:cs=>cs.filter(c=>c.fit).length,ctx:()=>"₹40–130 cr, PAT ≥ ₹5 cr",link:{t:["fit"]}},
      {key:"short",label:"Shortlist",fmt:"int",value:cs=>cs.filter(c=>c.shortlisted).length,ctx:cs=>`${cs.filter(c=>c.shortlisted&&c.dd).length} with diligence`,link:{t:["short"]}},
      {key:"pe",label:"Median P/E",fmt:"x",value:cs=>K.median(cs.map(c=>c.m.pe)),ctx:()=>"trailing, FY26 PAT"},
      {key:"pb",label:"Median P/B",fmt:"x",value:cs=>K.median(cs.map(c=>c.m.pb)),ctx:cs=>`${cs.filter(c=>c.m.pb!=null&&c.m.pb<1).length} trade below book`},
      {key:"pr",label:"Median promoter",fmt:"pct",value:cs=>K.median(cs.map(c=>c.m.pr)),ctx:cs=>`${cs.filter(c=>!(c.m.pr>0)).length} with no promoter`},
      {key:"netcash",label:"Net cash",fmt:"int",value:cs=>cs.filter(c=>c.m.nd!=null&&c.m.nd<=0).length,ctx:()=>"net debt ≤ 0",link:{t:["netcash"]}}
    ],
    scatter:{x:"mc", y:"pb", axes:["mc","pe","pb","roe","r26","p26","pg","pg3","pm","pr","inst","nd","ctrl"]},
    scoring:{criteria:[
      {key:"size",label:"Size fit",weight:20,explain:"1 inside the ₹40–130 cr band, falling linearly to 0 at ₹65 cr outside it."},
      {key:"growth",label:"Growth",weight:15,explain:"Percentile of FY24–FY26 PAT CAGR across the universe (n.m. scores 0)."},
      {key:"profit",label:"Profitability",weight:20,explain:"Percentile of implied ROE (P/B ÷ P/E)."},
      {key:"leverage",label:"Leverage",weight:15,explain:"Percentile of net debt ÷ market cap, lower is better."},
      {key:"control",label:"Controllability",weight:15,explain:"Promoter stake ÷ 75%, capped at 1 (0 with no promoter)."},
      {key:"value",label:"Valuation",weight:15,explain:"Percentile of P/B, lower is better."}
    ], score(c, cs){
      const mc=c.m.mc, d = mc==null?null: mc<MANDATE.lo? MANDATE.lo-mc : mc>MANDATE.hi? mc-MANDATE.hi : 0;
      return {
        size: d==null?0:Math.max(0,1-d/65),
        growth: K.pctRank(cs.map(x=>x.m.pg3), c.m.pg3) ?? 0,
        profit: K.pctRank(cs.map(x=>x.m.roe), c.m.roe) ?? 0,
        leverage: K.pctRank(cs.map(x=>x.m.ndmc), c.m.ndmc, true) ?? 0,
        control: c.m.pr>0 ? Math.min(1,c.m.pr/75) : 0,
        value: K.pctRank(cs.map(x=>x.m.pb), c.m.pb, true) ?? 0 };
    }},
    compare:[
      {sec:"Size",rows:["mc","r26","p26"]},
      {sec:"Valuation",rows:["pe","pb","roe"]},
      {sec:"Growth",rows:["rg","rg3","pg","pg3"]},
      {sec:"Profitability",rows:["pm"]},
      {sec:"Ownership",rows:["pr","inst"]},
      {sec:"Control",rows:["nd","ctrl"]}
    ],
    company:{ kpis:["mc","pe","pb","roe","pr","nd"], peers:["pe","pb","roe"], fin:true, hold:true, control:{openOffer:26}, revMix:true },
    methodology:[
      {h:"Sources and refresh",p:[
        "Market cap, price, P/E, P/B, revenue, PAT, borrowings and shareholding come from Screener.in (consolidated where available, otherwise standalone), refreshed every weekday at 4 PM IST by a scheduled job in the repo.",
        "Cash, vertical tags, classification evidence and LinkedIn contacts come from the Listed FS Companies Screen workbook (data.js). Diligence comes from audited annual reports and filings (diligence.js), with sources and dates on each company page.",
        "Where Screener rounds a figure to whole crores and the workbook value rounds to the same number, the more precise workbook value is kept. Audited borrowings in the workbook take precedence over Screener's figure, which includes leases."]},
      {h:"Mandate and screens",p:[
        `Mandate fit = market cap ₹${MANDATE.lo}–${MANDATE.hi} cr and FY26 PAT ≥ ₹${MANDATE.pat} cr. Clean & controllable = mandate fit, promoter ≥ 50% and net cash.`,
        "The shortlist is stored in the repo (shortlist.js) so the whole team sees one list. Starring in the screener stages a change you then publish to the repo."]},
      {h:"Derived measures",p:[
        `Growth and CAGR are shown as n.m. (not meaningful) when the prior-year or start value is zero, negative or below ₹${MIN_BASE} cr.`,
        "Implied ROE = P/B ÷ P/E. Net debt = latest borrowings − workbook cash. Cost to control = market cap × (promoter stake + 26% open offer under SEBI SAST), capped at 100%, at the current price before any premium. The regulatory open-offer price can be higher than the current price."]},
      {h:"Snapshots and changes",p:["Each refresh is a commit in the repo. The Overview compares the current data with the previous refresh commit: price moves beyond ±5%, flag changes, shareholding changes, mandate entries and exits, and failed refreshes."]}
    ],
    changeRules:{pct:[{k:"price",th:5,label:"Price"}], abs:[{k:"pr",th:0.01,label:"Promoter stake",unit:" pp"}], flags:["mandate","review","checkpat","nopromoter","diligence"]},
    dqGlobal: (failed.size? [{level:"neg",text:`${failed.size} compan${failed.size>1?"ies":"y"} failed the latest market refresh.`}] : []),
    sourceLine: `Screener.in market data ${asofStr||"n/a"} · workbook · diligence ${DDM.asof||"n/a"}`
  };
}

function METRICS(asof, ddAsof){
  const mk="Screener.in, daily refresh", wb="Listed FS workbook (data.js)", der="Derived";
  return {
    mc:{label:"Market cap",short:"Mkt cap",group:"Size",fmt:"cr",def:"Equity market value",formula:"Shares outstanding × price",source:mk,asof,better:null},
    price:{label:"Share price",short:"Price",group:"Size",fmt:"inr",def:"Last traded price",formula:"—",source:mk,asof},
    r24:{label:"Revenue FY24",short:"Rev FY24",group:"Growth",fmt:"cr",def:"Total revenue, FY24",formula:"—",source:mk,asof,better:"high"},
    r25:{label:"Revenue FY25",short:"Rev FY25",group:"Growth",fmt:"cr",def:"Total revenue, FY25",formula:"—",source:mk,asof,better:"high"},
    r26:{label:"Revenue FY26",short:"Rev FY26",group:"Size",fmt:"cr",def:"Total revenue, FY26 (year to 31 Mar 2026)",formula:"—",source:mk,asof,better:"high"},
    p24:{label:"PAT FY24",short:"PAT FY24",group:"Growth",fmt:"cr",def:"Profit after tax, FY24",formula:"—",source:mk,asof,better:"high"},
    p25:{label:"PAT FY25",short:"PAT FY25",group:"Growth",fmt:"cr",def:"Profit after tax, FY25",formula:"—",source:mk,asof,better:"high"},

<script>/* Greater Pacific dashboard kit — app shell and pages. Renders window.MODEL only; never computes or alters a

(function(){

// ---------- formatting ----------
const MINUS = "−";

function num(v,d=1){ if(v==null||!isFinite(v)) return NA; return v<0?`<span class="neg">${MINUS}${nf(v,d)}</span>`:nf(v,d); }
function fmt(k, v, c, opt={}){
  const mt = MET[k] || {fmt:opt.fmt||"cr"}; const f = opt.fmt || mt.fmt;

// ---------- URL state ----------
const list = s=>s?s.split(",").filter(Boolean).map(decodeURIComponent):[];

function parseW(s){ const o={}; list(s).forEach(p=>{ const [k,v]=p.split(":"); if(k&&v!=null&&isFinite(+v)) o[k]=+v; }); return o; }

  const h = location.hash.replace(/^#/,"") || "/overview";

    q:q.get("q")||"", g:list(q.get("g")), t:list(q.get("t")), r:parseR(q.get("r")), s:list(q.get("s")),

const href = (page, arg, st)=>`#/${page}${arg?"/"+encodeURIComponent(arg):""}${qs(st||{})}`;
function go(page, arg, st, replace){ const h=href(page,arg,st); if(replace) history.replaceState(null,"",h); else history.pushState(null,"",h); render(); }

// ---------- filtering + sorting ----------
const TOG = Object.fromEntries(M.filters.toggles.map(t=>[t.key,t]));
function filtered(st, cs){
  cs = cs || M.companies; const q=(st.q||"").toLowerCase();

    if(q){ const hay=(c.name+" "+c.ticker+" "+c.code+" "+c.desc+" "+c.seg+" "+c.groups.map(g=>G[g.key]?.label).join(" ")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(st.g&&st.g.length && !c.groups.some(g=>st.g.includes(g.key))) return false;
    for(const t of st.t||[]) if(TOG[t] && !TOG[t].test(c)) return false;
    for(const [k,[a,b]] of Object.entries(st.r||{})){ const v=c.m[k]; if(a!=null&&(v==null||v<a)) return false; if(b!=null&&(v==null||v>b)) return false; }
    return true;
  });
}
function sortKeys(st){ return (st.s&&st.s.length?st.s:[M.views[0].cols.includes("mc")?"-mc":"-"+(M.scatter.x)]).map(s=>({k:s.replace(/^-/,""),dir:s.startsWith("-")?-1:1})); }
function sorted(cs, st){
  const keys=sortKeys(st);
  const val=(c,k)=> k==="name"?c.name : k==="ev"?(c.ev?1:0) : k==="score"?totalScore(c,st) : (c.nm&&c.nm[k])?null : c.m[k];
  return cs.slice().sort((a,b)=>{ for(const {k,dir} of keys){ const va=val(a,k), vb=val(b,k);
    if(typeof va==="string"||typeof vb==="string"){ const r=String(va||"").localeCompare(String(vb||"")); if(r) return dir*r; continue; }

}
function weights(st){ const w={}; CRIT.forEach(c=>{ w[c.key]= st.w && st.w[c.key]!=null ? st.w[c.key] : c.weight; }); return w; }

function totalScore(c, st){ return Object.values(contributions(c,st)).reduce((a,b)=>a+b,0); }

// ---------- shortlist staging (browser draft until published to the repo) ----------
const DRAFT_KEY = "gpc-shortlist-draft-"+M.key;

  const meta = M.shortlistMeta||{}; const d=new Date();
  const upd = d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

// ---------- shell ----------
const NAV = [["overview","Overview"],["screener","Screener"],["shortlist","Shortlist"],["compare","Compare"],["dq","Data quality"],["method","Methodology"]];
function freshness(){
  if(!M.asofDate) return {tone:"neu",label:"No as-of date"};

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

function savedViews(){ try{ return JSON.parse(localStorage.getItem("gpc-views-"+M.key)||"[]"); }catch(e){ return []; } }
let openPop=null; function closePops(){ if(openPop){ openPop.remove(); openPop=null; } }
function colChooser(btn, st){
  closePops(); const cur=new Set(colsFor(st)); const groups={};
  ALLCOLS().forEach(k=>{ const g=(colDef(k).group)||"Other"; (groups[g]=groups[g]||[]).push(k); });
  const p=document.createElement("div"); p.className="pop"; p.setAttribute("role","dialog"); p.setAttribute("aria-label","Choose columns");
  p.innerHTML=Object.entries(groups).map(([g,ks])=>`<h4>${esc(g)}</h4>${ks.map(k=>`<label class="chk"><input type="checkbox" value="${k}" ${cur.has(k)?"checked":""}>${esc(colDef(k).label)}</label>`).join("")}`).join("")+
    `<div class="pills" style="margin-top:var(--s-3)"><button class="btn sm primary" type="button" data-apply>Apply</button><button class="btn sm" type="button" data-save>Save as view…</button><button class="btn sm" type="button" data-close>Close</button></div>`;
  document.body.appendChild(p); const r=btn.getBoundingClientRect(); p.style.top=(scrollY+r.bottom+6)+"px"; p.style.left=Math.max(8,Math.min(innerWidth-p.offsetWidth-8, r.left))+"px"; openPop=p; p.querySelector("input")?.focus();
  const chosen=()=>ALLCOLS().filter(k=>p.querySelector(`input[value="${k}"]`).checked);
  p.querySelector("[data-apply]").onclick=()=>{ closePops(); go("screener","",withState(st,{cols:chosen(),v:""})); };
  p.querySelector("[data-save]").onclick=()=>{ const name=prompt("Name this view"); if(!name) return; const v=savedViews().filter(x=>x.name!==name).concat({name,cols:chosen()}); try{ localStorage.setItem("gpc-views-"+M.key,JSON.stringify(v)); }catch(e){} closePops(); go("screener","",withState(st,{cols:chosen(),v:""})); toast(`Saved view “${name}” in this browser. The link also carries the columns.`); };
  p.querySelector("[data-close]").onclick=closePops;
  setTimeout(()=>document.addEventListener("click",function h(e){ if(openPop&&!openPop.contains(e.target)&&e.target!==btn){ closePops(); document.removeEventListener("click",h); } }),0);
}
function exportRows(st){
  const cols=colsFor(st).filter(k=>!MET[k]||MET[k].fmt!=="spark"), rows=sorted(filtered(st),st);
  const head=["Company","Ticker",M.groupLabel].concat(cols.map(k=>{ const m=colDef(k); return m.label+(MET[k]&&unitOf(k)?` (${unitOf(k).replace("₹","INR")})`:""); })).concat(["Flags","Shortlisted"]);
  const body=rows.map(c=>[c.name,c.code||c.ticker,c.groups.map(g=>G[g.key]?.label).join("; ")].concat(cols.map(k=>k==="desc"?c.desc:k==="ev"?(c.ev?"Yes":"No"):(c.nm&&c.nm[k])?"n.m.":(c.m[k]==null?"":+c.m[k].toFixed(4)))).concat([c.flags.map(f=>f.label).join("; "), c.shortlisted?"Yes":""]));
  return [head].concat(body);
}
function download(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function exportView(st, kind){
  const rows=exportRows(st), stamp=new Date().toISOString().slice(0,10), base=`${M.key}-screener-${stamp}`;
  if(kind==="csv"){ const csv=rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\r\n"); download(new Blob(["﻿"+csv],{type:"text/csv"}),base+".csv"); }
  else download(window.XLSX_LITE.build(rows,"Screener"), base+".xlsx");
  toast(`Exported ${rows.length-1} rows.`);
}

    main.querySelector("#cards").innerHTML=rk.map((x,i)=>scard(x.c,i+1,x.total,s)).join("");
    main.querySelector("h2").textContent=`${shortName(rk[0].c.name)} ranks first on the current weights`; };
  drawScores();
  main.querySelectorAll("[data-w]").forEach(r=>r.oninput=()=>{ const s=route().st; const w2={...weights(s),[r.dataset.w]:+r.value}; main.querySelector("#w-"+r.dataset.w).textContent=r.value; history.replaceState(null,"",href("shortlist","",withState(s,{w:w2}))); drawScores(); });

  const dis=main.querySelector("#discard"); if(dis) dis.onclick=()=>{ setDraft({}); render(); };
};

      <tr><td class="l">Verdict</td>${cs.map(c=>`<td class="note">${c.verdict?pill(c.verdict.label,c.verdict.tone):"–"}</td>`).join("")}</tr>
      <tr class="sec"><td colspan="${cs.length+1}">Notes</td></tr><tr><td class="l">Thesis / notes</td>${cs.map(c=>`<td class="note">${esc(c.thesis||"–")}</td>`).join("")}</tr></tbody></table></div></section>`
    :`<div class="empty">Nothing to compare. Add companies above or shortlist some first.</div>`}
    <p class="caption">Printed on one landscape page. Figures as of ${esc(M.asof||"n/a")}.</p>`;

    const best=(k,vals)=>{ const b=(MET[k]||{}).better; const ok=vals.filter(v=>v!=null&&isFinite(v)); if(!b||ok.length<2) return {}; const mx=Math.max(...ok), mn=Math.min(...ok); if(mx===mn) return {}; return b==="high"?{best:mx,worst:mn}:{best:mn,worst:mx}; };
    html+=slide("Comparison","Compare",`<table class="cmp"><thead><tr><th class="l">Metric</th>${cs.map(c=>`<th>${esc(shortName(c.name))}</th>`).join("")}</tr></thead><tbody>
      ${M.compare.map(sec=>`<tr class="sec"><td colspan="${cs.length+1}">${esc(sec.sec)}</td></tr>${sec.rows.map(k=>{ const v=cs.map(c=>c.nm&&c.nm[k]?null:c.m[k]), bw=best(k,v); return `<tr><td class="l">${esc(MET[k].label)} <span class="subtle">${esc(unitOf(k))}</span></td>${cs.map((c,i)=>`<td class="${v[i]!=null&&v[i]===bw.best?"best":v[i]!=null&&v[i]===bw.worst?"worst":""}">${fmt(k,c.m[k],c)}</td>`).join("")}</tr>`; }).join("")}`).join("")}
      <tr class="sec"><td colspan="${cs.length+1}">Notes</td></tr><tr><td class="l">Thesis</td>${cs.map(c=>`<td class="note">${esc(trim(c.thesis||"–"))}</td>`).join("")}</tr></tbody></table><p class="caption">Green = best, red = worst in each row by the metric's direction.</p>`);
  }
  html+=slide("Methodology","Methodology",`<div class="grid g2">${M.methodology.map(s=>`<section class="prose"><h2>${esc(s.h)}</h2>${s.p.map(p=>`<p>${esc(p)}</p>`).join("")}</section>`).join("")}<section class="prose"><h2>Scoring</h2><p>${CRIT.map(k=>`${esc(k.label)} ${weights(st)[k.key]}`).join(" · ")} (weights). ${CRIT.map(k=>`${esc(k.label)}: ${esc(k.explain)}`).join(" ")}</p></section></div>`);
  pack.innerHTML=html;
  const pages=pack.querySelectorAll(".slide"); pages.forEach((p,i)=>{ const pg=p.querySelector(".pg"); if(pg) pg.textContent=`Page ${i+1} of ${pages.length}`; });
  document.body.classList.add("printing"); pack.style.display="block";
  // charts are drawn after insertion so they size to the slide
  pack.querySelectorAll("[data-chart]").forEach(el=>{ const kind=el.dataset.chart, c=byId.get(el.dataset.id);
    if(kind==="scatter"){ const ax=M.scatter.x, ay=M.scatter.y, any=M.companies.some(x=>x.shortlisted); C.scatter(el,{domainAll:true,height:300,points:M.companies.map(x=>({id:x.id,x:x.m[ax],y:x.m[ay],color:G[x.prim].color,shape:G[x.prim].shape,series:x.prim,label:x.shortlisted?shortName(x.name):null,faded:any&&!x.shortlisted,c:x})),xLabel:`${MET[ax].label} (${unitOf(ax)})`,yLabel:`${MET[ay].label} (${unitOf(ay)})`,band:M.mandate&&ax===M.mandate.metric?[M.mandate.lo,M.mandate.hi]:null,bandLabel:M.mandate?M.mandate.label:"",medianY:K.median(M.companies.map(x=>x.m[ay])),xTick:v=>tick(ax,v),yTick:v=>tick(ay,v),tip:p=>scatterTip(p.c,ax,ay)}); }
    if(kind==="fin"){ if(c.fin) C.combo(el,{height:230,cats:c.fin.cats,fmt:v=>(v<0?MINUS:"")+nf(v,1),bars:[{key:"rev",label:"Revenue",values:c.fin.rev,color:"var(--viz-1)"},{key:"pat",label:"PAT",values:c.fin.pat,color:"var(--viz-3)"}],tip:()=>"",line:{values:c.fin.cats.map((_,j)=>c.fin.rev[j]?c.fin.pat[j]/c.fin.rev[j]*100:null),color:"var(--viz-2)",short:"PAT margin",fmt:v=>v==null?"":v.toFixed(1)+"%",tick:v=>v+"%",axis:"PAT margin %",tipFn:()=>""},yLabel:"₹ cr"});
      else C.columns(el,{height:230,items:[{label:"Revenue",value:c.m.r},{label:"EBITDA",value:c.m.e},{label:"Net profit",value:c.m.p}],fmt:v=>(v<0?MINUS:"")+nf(v,1),yLabel:"₹ cr",tip:()=>""}); }
    if(kind==="peers"){ const peers=M.companies.filter(x=>x.prim===c.prim); C.dotPlot(el,{labelW:80,rows:M.company.peers.map(k=>({label:MET[k].short,value:c.nm[k]?null:c.m[k],peers:peers.map(x=>x.m[k]),fmt:v=>fmtPlain(k,v),tick:v=>tick(k,v)}))}); }
  });
  // fit: largest scale s (0.5..1) at which the content, laid out at width W/s, fits the slide body in both directions
  pack.querySelectorAll(".sb").forEach(sb=>{ const f=sb.firstElementChild, cs=getComputedStyle(sb);
    const W=sb.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), H=sb.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const fits=s=>{ f.style.width=(W/s)+"px"; return f.scrollHeight*s<=H+0.5 && f.scrollWidth*s<=W+0.5; };
    let lo=0.5, hi=1; if(fits(1)){ lo=1; } else { for(let i=0;i<10;i++){ const mid=(lo+hi)/2; if(fits(mid)) lo=mid; else hi=mid; } }
    f.style.width=(W/lo)+"px"; f.style.transform=`scale(${lo})`; f.dataset.scale=lo.toFixed(3);
    if(f.scrollHeight*lo>H+1) sb.dataset.overflow="1"; });
  return pack;
}function chipText(st){ const p=[]; if(st.q) p.push(`search “${st.q}”`); (st.g||[]).forEach(k=>G[k]&&p.push(G[k].short)); (st.t||[]).forEach(k=>TOG[k]&&p.push(TOG[k].label)); Object.entries(st.r||{}).forEach(([k,v])=>MET[k]&&p.push(rangeLabel(k,v))); return p.length?"Filters: "+p.join(" · ")+".":"No filters."; }
function exportPack(){ buildPack(); setTimeout(()=>{ window.print(); },50); }
addEventListener("afterprint",()=>{ document.body.classList.remove("printing","print-compare"); const p=document.getElementById("pack"); if(p){ p.innerHTML=""; p.style.display=""; } });

// ---------- boot ----------
shell();
addEventListener("hashchange", render);
addEventListener("popstate", render);
let rz, rw=innerWidth; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(innerWidth-rw)>40 && !document.body.classList.contains("printing")){ rw=innerWidth; lastKey=""; render(); } },200); });
render();
if(route().st.pack){ buildPack(); document.body.classList.add("pack-preview"); document.documentElement.setAttribute("data-pack-ready","1"); }
window.__APP = { render, route, filtered, sorted, fmt, fmtPlain, buildPack, M, PREV, PAGES };
})();
</script>
