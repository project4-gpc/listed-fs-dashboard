/* Greater Pacific dashboard kit — design tokens.
   The ONLY file allowed to contain literal colours, font sizes or spacing values (enforced by qa.ps1).
   Brand values: see brand/brand.json. Light theme only (no dark theme in the brand material). */
:root{
  color-scheme: light;

  /* Brand */
  --brand-primary:   #010039;  /* logo navy */
  --brand-secondary: #002060;  /* deck navy */
  --brand-accent:    #97A8C1;  /* website steel blue */
  --brand-on-primary:#FFFFFF;

  /* Neutral scale (cool grey, tuned toward the brand navy) */
  --n-0:   #FFFFFF;
  --n-50:  #F6F7FA;
  --n-100: #EDF0F5;
  --n-200: #DDE2EA;
  --n-300: #C5CCD8;
  --n-400: #9AA3B5;
  --n-500: #737D92;
  --n-600: #5A6377;
  --n-700: #434B5E;
  --n-800: #2A3044;
  --n-900: #141832;

  /* Surfaces, text, borders */
  --bg:            var(--n-50);
  --surface:       var(--n-0);
  --surface-sunk:  var(--n-100);
  --surface-raise: var(--n-0);
  --surface-brand: var(--brand-primary);
  --border:        var(--n-200);
  --border-strong: var(--n-300);
  --text:          var(--n-900);
  --text-muted:    var(--n-600);
  --text-subtle:   var(--n-500);
  --text-on-brand: var(--brand-on-primary);
  --link:          var(--brand-secondary);
  --focus:         #2F6FD6;
  --select-bg:     #E4EAF4;
  --hover-bg:      var(--n-100);
  --overlay:       rgba(1,0,57,.42);
  --shadow-1: 0 1px 2px rgba(1,0,57,.06), 0 1px 1px rgba(1,0,57,.04);
  --shadow-2: 0 6px 24px rgba(1,0,57,.14), 0 2px 6px rgba(1,0,57,.08);

  /* Semantic — chosen to sit apart from the navy/steel brand hues */
  --positive:    #17703F;
  --positive-bg: #E5F2EA;
  --negative:    #C00000;  /* the deck red, used only to mean "negative" */
  --negative-bg: #FBE9E9;
  --warning:     #9A5B00;
  --warning-bg:  #FBF0DC;
  --info:        #1D5FA8;
  --info-bg:     #E3EDF8;

  /* Data-viz: categorical (8), anchored on the brand navy; order = assignment order */
  --viz-1: #002060;  /* brand navy */
  --viz-2: #D9661F;  /* deck orange, deepened for contrast */
  --viz-3: #3A86C8;  /* deck light blue, deepened */
  --viz-4: #16735C;  /* teal */
  --viz-5: #8A5CB8;  /* violet */
  --viz-6: #6E5A00;  /* dark olive */
  --viz-7: #8C847C;  /* warm grey */
  --viz-8: #C2457A;  /* rose */
  --viz-muted: var(--n-300);
  --viz-band:  rgba(151,168,193,.20);
  --viz-grid:  var(--n-200);
  --viz-axis:  var(--n-400);
  --viz-median: var(--n-600);

  /* Sequential (navy, light → dark) */
  --seq-1: #EEF2F8; --seq-2: #D3DDEC; --seq-3: #A9BCD9; --seq-4: #7A96C2;
  --seq-5: #4D70A8; --seq-6: #284C8A; --seq-7: #002060;
  /* Diverging (red ↔ neutral ↔ navy) */
  --div-n3: #B2182B; --div-n2: #E07B6E; --div-n1: #F7CFC8; --div-0: #F2F2F2;
  --div-p1: #C9D6EA; --div-p2: #6F8FC4; --div-p3: #002060;

  /* Typography */
  --font-display: "Martel", Georgia, "Times New Roman", serif;
  --font-body: "Heebo", Arial, "Helvetica Neue", system-ui, sans-serif;
  --font-num: "Heebo", Arial, system-ui, sans-serif;
  --fs-display: 30px; --lh-display: 1.2;
  --fs-h1: 22px;      --lh-h1: 1.25;
  --fs-h2: 17px;      --lh-h2: 1.3;
  --fs-h3: 14px;      --lh-h3: 1.35;
  --fs-body: 14px;    --lh-body: 1.5;
  --fs-small: 13px;
  --fs-caption: 12px;
  --fs-micro: 11px;
  --fs-kpi: 24px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --tracking-caps: .07em;

  /* Spacing (4px base) */
  --s-0: 0; --s-px: 1px; --s-half: 2px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  /* Shape and layout */
  --r-1: 3px; --r-2: 6px; --r-3: 10px; --r-pill: 999px;
  --bw: 1px; --bw-2: 2px; --bw-3: 3px;
  --sidebar-w: 232px; --sidebar-w-collapsed: 60px; --header-h: 60px;
  --content-max: 1560px;
  --logo-h: 28px;  /* logo rendered height; min width 112px per brand.json */
  --icon: 16px; --dot: 8px; --spark-w: 64px; --spark-h: 18px;
  --z-header: 30; --z-drawer: 40; --z-modal: 50; --z-tip: 60;
  --dur-1: .12s; --dur-2: .35s; --dur-3: .6s; --dur-4: .9s;
  --ease: cubic-bezier(.2,.7,.2,1);
  --ease-spring: cubic-bezier(.34,1.4,.64,1);

  /* Brand surfaces on dark (hero bands, navy sidebar, presentation mode) */
  --hero-from: #010039;
  --hero-mid:  #071C57;
  --hero-to:   #0F3A7A;
  --hero-glow: rgba(151,168,193,.30);
  --hero-glow-2: rgba(58,134,200,.22);
  --hero-grid: rgba(255,255,255,.045);
  --on-dark: #FFFFFF;
  --on-dark-muted: #C3CDDD;
  --on-dark-subtle: #A9B5CA;
  --on-dark-border: rgba(255,255,255,.16);
  --glass-bg: rgba(255,255,255,.075);
  --glass-bg-hover: rgba(255,255,255,.13);
  --glass-border: rgba(255,255,255,.16);
  --positive-on-dark: #7CE3AE;
  --negative-on-dark: #FFA4A4;
  --warning-on-dark: #FFD48A;
  --star: #FFFFFF;
  --star-dim: rgba(255,255,255,.22);
  --star-glow: rgba(151,168,193,.55);
  --side-bg: #010039;
  --side-text: #C3CDDD;
  --side-text-strong: #FFFFFF;
  --side-hover: rgba(255,255,255,.07);
  --side-active: rgba(151,168,193,.20);
  --side-accent: #97A8C1;
  --side-border: rgba(255,255,255,.10);

  /* Interaction */
  --shadow-3: 0 24px 60px rgba(1,0,57,.20), 0 8px 20px rgba(1,0,57,.10);
  --shadow-hover: 0 10px 28px rgba(1,0,57,.12), 0 2px 6px rgba(1,0,57,.06);
  --brush-fill: rgba(47,111,214,.10);
  --brush-stroke: #2F6FD6;
  --pulse: rgba(0,32,96,.35);
  --pulse-on-dark: rgba(255,255,255,.55);
  --bar-pos: rgba(0,32,96,.12);
  --bar-neg: rgba(192,0,0,.12);
  --tint-strength: 26%;

  /* Extra type sizes */
  --fs-hero: 30px; --lh-hero: 1.22;
  --fs-hero-m: 21px;
  --fs-kpi-hero: 32px;
  --fs-tiny: 10px;

  /* Extra layout */
  --r-4: 16px;
  --hero-pad: 28px;
  --lab-h: 470px;
  --col-w: 276px; --drawer-w: 500px; --av: 26px; --av-sm: 18px;
  --river-particle: rgba(255,255,255,.85);
  --tm-h: 430px;
}

/* Greater Pacific dashboard kit — components. Uses tokens only (see tokens.css); qa.ps1 rejects literals. */
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + var(--s-4))}
body{margin:var(--s-0);background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.num,td.n,.kpi-v,.tnum{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{margin:var(--s-0);font-weight:var(--fw-semibold)}
h1{font-family:var(--font-display);font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-bold);color:var(--brand-primary)}
h2{font-family:var(--font-body);font-size:var(--fs-h2);line-height:var(--lh-h2)}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3)}
.display{font-family:var(--font-display);font-size:var(--fs-display);line-height:var(--lh-display);font-weight:var(--fw-bold);color:var(--brand-primary)}
.caption{font-size:var(--fs-caption);color:var(--text-muted)}
.eyebrow{font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);font-weight:var(--fw-medium)}
.muted{color:var(--text-muted)} .subtle{color:var(--text-subtle)}
.pos{color:var(--positive)} .neg{color:var(--negative)} .na{color:var(--text-subtle)}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:var(--bw-2) solid var(--focus);outline-offset:var(--s-half)}
.sr{position:absolute;width:var(--s-px);height:var(--s-px);overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s-2);top:var(--s-2);z-index:var(--z-modal);background:var(--surface);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);transform:translateY(-200%)}
.skip:focus{transform:none}

/* ---------- header ---------- */
.hdr{position:sticky;top:var(--s-0);z-index:var(--z-header);height:var(--header-h);background:var(--surface);border-bottom:var(--bw) solid var(--border);display:flex;align-items:center;gap:var(--s-4);padding:var(--s-0) var(--s-4)}
.hdr .logo{display:flex;align-items:center;padding:var(--s-1) var(--s-0);flex:none}
.hdr .logo img{height:var(--logo-h);width:auto;min-width:calc(var(--logo-h) * 5.5);display:block}
.hdr .prod{display:flex;flex-direction:column;min-width:var(--s-0);border-left:var(--bw) solid var(--border);padding-left:var(--s-4)}
.hdr .prod b{font-family:var(--font-display);font-size:var(--fs-h3);color:var(--brand-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:var(--fw-bold)}
.hdr .prod span{font-size:var(--fs-caption);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .grow{flex:1}
.hdr .caption{white-space:nowrap}
.hdr .conf{font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted);border:var(--bw) solid var(--border);border-radius:var(--r-1);padding:var(--s-half) var(--s-2);white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:var(--s-8);min-width:var(--s-8);padding:var(--s-0) var(--s-2);border:var(--bw) solid transparent;background:transparent;border-radius:var(--r-2);color:var(--text-muted)}
.iconbtn:hover{background:var(--hover-bg);color:var(--text)}
.iconbtn svg{width:var(--icon);height:var(--icon);flex:none}
.searchbtn{white-space:nowrap;border-color:var(--border);color:var(--text-muted);min-width:calc(var(--s-16) * 3);justify-content:flex-start;background:var(--bg)}
.searchbtn kbd{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-micro);border:var(--bw) solid var(--border);border-radius:var(--r-1);padding:var(--s-0) var(--s-1);background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:var(--s-2);height:var(--s-8);padding:var(--s-0) var(--s-3);border:var(--bw) solid var(--border-strong);background:var(--surface);border-radius:var(--r-2);font-size:var(--fs-small);font-weight:var(--fw-medium);color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand-secondary);color:var(--brand-secondary)}
.btn.primary{background:var(--brand-primary);border-color:var(--brand-primary);color:var(--text-on-brand)}
.btn.primary:hover{background:var(--brand-secondary);color:var(--text-on-brand)}
.btn.sm{height:calc(var(--s-6) + var(--s-1));padding:var(--s-0) var(--s-2);font-size:var(--fs-caption)}
.btn svg{width:var(--icon);height:var(--icon)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:var(--s-1);height:calc(var(--s-5));padding:var(--s-0) var(--s-2);border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:var(--fw-semibold);white-space:nowrap;border:var(--bw) solid transparent;line-height:1}
.pill .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.pill.pos{background:var(--positive-bg);color:var(--positive)}
.pill.neg{background:var(--negative-bg);color:var(--negative)}
.pill.warn{background:var(--warning-bg);color:var(--warning)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neu{background:var(--surface-sunk);color:var(--text-muted)}
.pill.brand{background:var(--brand-primary);color:var(--text-on-brand)}
.pill.outline{background:var(--surface);border-color:var(--border-strong);color:var(--text-muted)}
.vpill{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--fs-micro);color:var(--text-muted);white-space:nowrap}
.vpill .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);align-items:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(var(--s-0),1fr);min-height:calc(100vh - var(--header-h))}
.shell.collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(var(--s-0),1fr)}
.side{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow:auto;background:var(--surface);border-right:var(--bw) solid var(--border);padding:var(--s-3) var(--s-2);display:flex;flex-direction:column;gap:var(--s-1)}
.side a{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);color:var(--text-muted);text-decoration:none;font-weight:var(--fw-medium);white-space:nowrap;overflow:hidden}
.side a svg{width:var(--icon);height:var(--icon);flex:none}
.side a:hover{background:var(--hover-bg);color:var(--text)}
.side a[aria-current=page]{background:var(--select-bg);color:var(--brand-primary)}
.side .ct{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-micro);color:var(--text-subtle)}
.side .sep{height:var(--s-px);background:var(--border);margin:var(--s-2) var(--s-1)}
.side .foot{margin-top:auto;font-size:var(--fs-micro);color:var(--text-subtle);padding:var(--s-2) var(--s-3)}
.collapsed .side a span,.collapsed .side .ct,.collapsed .side .foot{display:none}
.collapsed .side a{justify-content:center;padding:var(--s-2)}
.main{min-width:var(--s-0);padding:var(--s-5) var(--s-6) var(--s-12);max-width:var(--content-max);width:100%}
.scrim{display:none}
@media (max-width:900px){
  .shell,.shell.collapsed{grid-template-columns:minmax(var(--s-0),1fr)}
  .side{position:fixed;left:var(--s-0);top:var(--s-0);height:100vh;width:min(var(--sidebar-w), 85vw);z-index:var(--z-drawer);transform:translateX(-105%);transition:transform var(--dur-1) var(--ease);box-shadow:var(--shadow-2)}
  .drawer-open .side{transform:none}
  .drawer-open .scrim{display:block;position:fixed;inset:var(--s-0);background:var(--overlay);z-index:calc(var(--z-drawer) - 1)}
  .collapsed .side a span,.collapsed .side .ct,.collapsed .side .foot{display:revert}
  .main{padding:var(--s-4) var(--s-4) var(--s-12)}
  .hdr{gap:var(--s-2);padding:var(--s-0) var(--s-3)}
  .hdr .prod,.hdr .conf-wide,.searchbtn .lbl,.searchbtn kbd,.hdr .hide-m{display:none}
  .searchbtn{min-width:var(--s-8)}
}
@media (min-width:901px){ .only-m{display:none!important} }

/* chips bar */
.chipbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-bottom:var(--s-4)}
.chipbar:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:var(--s-1);height:var(--s-6);padding:var(--s-0) var(--s-1) var(--s-0) var(--s-3);border-radius:var(--r-pill);background:var(--select-bg);color:var(--brand-primary);font-size:var(--fs-caption);font-weight:var(--fw-medium);border:var(--bw) solid var(--border)}
.fchip button{border:0;background:transparent;width:calc(var(--s-5));height:calc(var(--s-5));border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;color:var(--brand-primary)}
.fchip button:hover{background:var(--surface)}
.fchip button svg{width:var(--s-3);height:var(--s-3)}
.linkbtn{border:0;background:none;padding:var(--s-0);color:var(--link);font-size:var(--fs-caption);text-decoration:underline;text-underline-offset:var(--s-half)}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s-3) var(--s-6);margin-bottom:var(--s-4)}
.ph p{margin:var(--s-1) var(--s-0) var(--s-0);color:var(--text-muted);max-width:90ch}
.ph .acts{display:flex;flex-wrap:wrap;gap:var(--s-2)}

/* cards and grids */
.card{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-3);padding:var(--s-4);min-width:var(--s-0);box-shadow:var(--shadow-1)}
.card.flush{padding:var(--s-0)}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:var(--s-2) var(--s-4);margin-bottom:var(--s-3)}
.card.flush .card-h{padding:var(--s-4) var(--s-4) var(--s-0)}
.card-h h2{font-size:var(--fs-h3);font-weight:var(--fw-semibold)}
.card-h .sub{font-size:var(--fs-caption);color:var(--text-muted);margin-top:var(--s-half)}
.grid{display:grid;gap:var(--s-4)}
.g2{grid-template-columns:repeat(2,minmax(var(--s-0),1fr))}
.g3{grid-template-columns:repeat(3,minmax(var(--s-0),1fr))}
.g-main{grid-template-columns:minmax(var(--s-0),1.65fr) minmax(var(--s-0),1fr)}
@media (max-width:1100px){.g3,.g-main{grid-template-columns:minmax(var(--s-0),1fr)}}
@media (max-width:760px){.g2{grid-template-columns:minmax(var(--s-0),1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}

/* headline + KPIs */
.headline{font-family:var(--font-display);font-size:var(--fs-h2);line-height:var(--lh-h2);color:var(--brand-primary);margin:var(--s-0) var(--s-0) var(--s-4);max-width:100ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-16) * 2.4),1fr));gap:var(--s-px);background:var(--border);border:var(--bw) solid var(--border);border-radius:var(--r-3);overflow:hidden}
.kpi{background:var(--surface);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:var(--s-half);min-width:var(--s-0)}
.kpi-v{font-size:var(--fs-kpi);font-weight:var(--fw-medium);line-height:1.15;color:var(--text)}
.kpi-v small{font-size:var(--fs-small);color:var(--text-muted);font-weight:var(--fw-regular)}
.kpi .delta{font-size:var(--fs-caption);font-family:var(--font-num)}
.kpi .ctx{font-size:var(--fs-caption);color:var(--text-muted)}
a.kpi{text-decoration:none;color:inherit}
a.kpi:hover{background:var(--hover-bg)}

/* change list */
.chg{list-style:none;margin:var(--s-0);padding:var(--s-0);display:flex;flex-direction:column}
.chg li{display:grid;grid-template-columns:auto minmax(var(--s-0),1fr) auto;gap:var(--s-3);align-items:baseline;padding:var(--s-2) var(--s-0);border-bottom:var(--bw) solid var(--border);font-size:var(--fs-small)}
.chg li:last-child{border-bottom:0}
.chg .what{min-width:var(--s-0)}
.chg .v{font-family:var(--font-num);white-space:nowrap}
.empty{padding:var(--s-8) var(--s-4);text-align:center;color:var(--text-muted);font-size:var(--fs-small)}

/* ---------- table ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;padding:var(--s-3) var(--s-4);border-bottom:var(--bw) solid var(--border)}
.tbar .grow{flex:1}
.tbar select,.inp{font:inherit;font-size:var(--fs-small);height:var(--s-8);border:var(--bw) solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);color:var(--text);padding:var(--s-0) var(--s-2);min-width:var(--s-0)}
.inp{width:100%}
.tscroll{overflow:auto;max-height:calc(100vh - var(--header-h) - var(--s-16) * 2)}
table.grid-t{border-collapse:separate;border-spacing:var(--s-0);width:max-content;min-width:100%;font-size:var(--fs-small)}
.grid-t th,.grid-t td{padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);white-space:nowrap;background:var(--surface)}
.grid-t thead th{position:sticky;top:var(--s-0);z-index:3;font-weight:var(--fw-medium);color:var(--text-muted);font-size:var(--fs-caption);text-align:right;vertical-align:bottom;user-select:none}
.grid-t thead tr.grp th{top:var(--s-0);text-align:center;font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--brand-secondary);border-bottom:var(--bw-2) solid var(--brand-accent);padding:var(--s-1) var(--s-3)}
.grid-t thead tr.cols th{top:calc(var(--s-6) + var(--s-half))}
.grid-t thead th.sortable{cursor:pointer}
.grid-t thead th.sortable:hover{color:var(--text)}
.grid-t thead th[aria-sort]{color:var(--brand-primary)}
.grid-t .sortk{font-family:var(--font-num);font-size:var(--fs-micro);margin-left:var(--s-half)}
.grid-t td{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.grid-t th.l,.grid-t td.l{text-align:left;font-family:var(--font-body)}
.grid-t .stk{position:sticky;left:var(--s-0);z-index:2;box-shadow:inset calc(var(--bw) * -1) 0 0 var(--border)}
.grid-t thead .stk{z-index:4}
.grid-t tbody tr{cursor:pointer}
.grid-t tbody tr:hover td{background:var(--hover-bg)}
.grid-t tbody tr.sel td{background:var(--select-bg)}
.grid-t td.first{min-width:calc(var(--s-16) * 4.4);max-width:calc(var(--s-16) * 5.2);white-space:normal}
.cname{font-weight:var(--fw-semibold);color:var(--text);display:block;line-height:1.3}
.cmeta{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-2);margin-top:var(--s-1);font-size:var(--fs-micro);color:var(--text-muted)}
.grid-t td.desc{white-space:normal;min-width:calc(var(--s-16) * 4.5);max-width:calc(var(--s-16) * 6);color:var(--text-muted);font-size:var(--fs-caption);font-family:var(--font-body);text-align:left}
.grid-t .gstart{border-left:var(--bw) solid var(--border)}
.heat-p1{background:var(--div-p1)!important} .heat-p2{background:var(--div-p1)!important;box-shadow:inset 0 calc(var(--bw-3) * -1) 0 var(--div-p2)}
.heat-n1{background:var(--div-n1)!important} .heat-n2{background:var(--div-n1)!important;box-shadow:inset 0 calc(var(--bw-3) * -1) 0 var(--div-n2)}
.nm{color:var(--text-subtle);border-bottom:var(--bw) dotted var(--text-subtle);cursor:help}
.spark{display:inline-block;vertical-align:middle}
.mandate-edge td.first{box-shadow:inset var(--bw-3) 0 0 var(--brand-secondary), inset calc(var(--bw) * -1) 0 0 var(--border)}

/* popover / menus */
.pop{position:absolute;z-index:var(--z-modal);background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--r-3);box-shadow:var(--shadow-2);padding:var(--s-3);min-width:calc(var(--s-16) * 4);max-height:70vh;overflow:auto}
.pop h4{margin:var(--s-2) var(--s-0) var(--s-1);font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.chk{display:flex;align-items:center;gap:var(--s-2);font-size:var(--fs-small);padding:var(--s-1) var(--s-0);cursor:pointer}
.chk input{accent-color:var(--brand-secondary);width:var(--icon);height:var(--icon);margin:var(--s-0)}

/* filter panel */
.fpanel{display:flex;flex-direction:column;gap:var(--s-4)}
.fgrp{display:flex;flex-direction:column;gap:var(--s-2)}
.fgrp > .eyebrow{display:block}
.rng{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s-1);align-items:center}
.rng span{color:var(--text-subtle);font-size:var(--fs-caption)}
.rlab{display:flex;justify-content:space-between;gap:var(--s-2);font-size:var(--fs-small)}
.rlab em{font-style:normal;color:var(--text-subtle);font-family:var(--font-num);font-size:var(--fs-micro)}
.gchip{display:inline-flex;align-items:center;gap:var(--s-1);border:var(--bw) solid var(--border);border-radius:var(--r-pill);padding:var(--s-half) var(--s-2);font-size:var(--fs-caption);background:var(--surface);text-align:left;line-height:1.3}
.gchip .dot{width:var(--dot);height:var(--dot);border-radius:var(--r-pill);flex:none}
.gchip .n{font-family:var(--font-num);color:var(--text-subtle);font-size:var(--fs-micro)}
.gchip[aria-pressed=true]{background:var(--select-bg);border-color:var(--brand-secondary);color:var(--brand-primary)}
.scr-layout{display:grid;grid-template-columns:calc(var(--s-16) * 4) minmax(var(--s-0),1fr);gap:var(--s-4);align-items:start}
.scr-layout > .card:first-child{position:sticky;top:calc(var(--header-h) + var(--s-4));max-height:calc(100vh - var(--header-h) - var(--s-8));overflow:auto}
@media (max-width:1100px){.scr-layout{grid-template-columns:minmax(var(--s-0),1fr)}.scr-layout > .card:first-child{position:static;max-height:none}}
details.fold > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:var(--fw-semibold)}
details.fold > summary::-webkit-details-marker{display:none}
@media (min-width:1101px){ details.fold > summary{display:none} }

/* company page */
.co-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s-3) var(--s-6);align-items:flex-start;margin-bottom:var(--s-4)}
.co-h .meta{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-top:var(--s-2);font-size:var(--fs-small);color:var(--text-muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s-1) var(--s-4);margin:var(--s-0);font-size:var(--fs-small)}
.kv dt{color:var(--text-muted)} .kv dd{margin:var(--s-0);text-align:right;font-family:var(--font-num)}
.notes{margin:var(--s-0);padding-left:var(--s-4);display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-small)}
.notes li::marker{color:var(--brand-accent)}
.srcs{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-3);font-size:var(--fs-caption)}
.calc{display:grid;gap:var(--s-3)}
.calc input[type=range]{width:100%;accent-color:var(--brand-secondary)}
.calc .out{display:grid;grid-template-columns:repeat(3,minmax(var(--s-0),1fr));gap:var(--s-px);background:var(--border);border-radius:var(--r-2);overflow:hidden}
.calc .out div{background:var(--surface-sunk);padding:var(--s-2) var(--s-3)}
.calc .out b{display:block;font-family:var(--font-num);font-size:var(--fs-h2);font-weight:var(--fw-medium)}
.dq{list-style:none;margin:var(--s-0);padding:var(--s-0);display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-small)}
.dq li{display:flex;gap:var(--s-2);align-items:baseline}
.pn{display:flex;gap:var(--s-2)}

/* shortlist + compare */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--s-16) * 5),1fr));gap:var(--s-4)}
.scard{display:flex;flex-direction:column;gap:var(--s-3)}
.scard .top{display:flex;justify-content:space-between;gap:var(--s-2);align-items:flex-start}
.scard .rank{font-family:var(--font-num);font-size:var(--fs-h2);color:var(--brand-accent);font-weight:var(--fw-bold)}
.scard .thesis{margin:var(--s-0);font-size:var(--fs-small)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(var(--s-0),1fr));gap:var(--s-px);background:var(--border);border-radius:var(--r-2);overflow:hidden}
.mini div{background:var(--surface-sunk);padding:var(--s-1) var(--s-2);font-size:var(--fs-micro);color:var(--text-muted)}
.mini b{display:block;font-family:var(--font-num);font-size:var(--fs-small);color:var(--text);font-weight:var(--fw-medium)}
.wts{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-16) * 3),1fr));gap:var(--s-2) var(--s-5)}
.wt{display:grid;grid-template-columns:1fr auto;gap:var(--s-1) var(--s-2);font-size:var(--fs-small);align-items:center}
.wt input{grid-column:1/-1;width:100%;accent-color:var(--brand-secondary)}
.wt b{font-family:var(--font-num)}
table.cmp{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
.cmp th,.cmp td{padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);text-align:right;vertical-align:top}
.cmp th.l,.cmp td.l{text-align:left}
.cmp thead th{font-weight:var(--fw-semibold);color:var(--brand-primary);vertical-align:bottom}
.cmp tr.sec td{background:var(--surface-sunk);font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--brand-secondary);font-weight:var(--fw-semibold);text-align:left}
.cmp td.best{background:var(--positive-bg);color:var(--positive);font-weight:var(--fw-semibold)}
.cmp td.worst{background:var(--negative-bg);color:var(--negative)}
.cmp td{font-family:var(--font-num)}
.cmp td.l,.cmp td.note{font-family:var(--font-body)}
.cmp td.note{text-align:left;white-space:normal;font-size:var(--fs-caption);color:var(--text-muted)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:var(--s-2)}
.fstage{display:grid;grid-template-columns:minmax(var(--s-0),1fr) auto;gap:var(--s-1) var(--s-3);text-decoration:none;color:inherit;padding:var(--s-2);border-radius:var(--r-2)}
.fstage:hover{background:var(--hover-bg)}
.fstage .bar{grid-column:1/-1;height:var(--s-3);background:var(--surface-sunk);border-radius:var(--r-1);overflow:hidden}
.fstage .bar i{display:block;height:100%;background:var(--brand-secondary);border-radius:var(--r-1)}
.fstage b{font-family:var(--font-num);font-size:var(--fs-h2);font-weight:var(--fw-medium)}
.fstage .l{font-size:var(--fs-small);font-weight:var(--fw-medium)}
.fstage .d{font-size:var(--fs-caption);color:var(--text-muted)}

/* search modal */
.modal{position:fixed;inset:var(--s-0);z-index:var(--z-modal);background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.modal[hidden]{display:none}
.sbox{width:min(calc(var(--s-16) * 10), 92vw);background:var(--surface);border-radius:var(--r-3);box-shadow:var(--shadow-2);overflow:hidden}
.sbox input{width:100%;border:0;border-bottom:var(--bw) solid var(--border);padding:var(--s-4);font:inherit;font-size:var(--fs-h2);outline:none}
.sres{list-style:none;margin:var(--s-0);padding:var(--s-2);max-height:55vh;overflow:auto}
.sres li a{display:flex;justify-content:space-between;gap:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-2);text-decoration:none;color:var(--text)}
.sres li a[aria-selected=true],.sres li a:hover{background:var(--select-bg)}
.sres .k{font-size:var(--fs-caption);color:var(--text-muted)}
.sres mark{background:var(--warning-bg);color:inherit}

/* tooltip + toast */
.tip{position:fixed;z-index:var(--z-tip);pointer-events:none;background:var(--n-900);color:var(--n-0);font-size:var(--fs-caption);line-height:1.4;padding:var(--s-2) var(--s-3);border-radius:var(--r-2);max-width:calc(var(--s-16) * 5);box-shadow:var(--shadow-2)}
.tip[hidden]{display:none}
.tip b{font-weight:var(--fw-semibold)}
.toast{position:fixed;left:50%;bottom:var(--s-6);transform:translateX(-50%);z-index:var(--z-tip);background:var(--n-900);color:var(--n-0);padding:var(--s-2) var(--s-4);border-radius:var(--r-2);font-size:var(--fs-small)}
.toast[hidden]{display:none}
[data-tip]{cursor:help}
th[data-tip]{cursor:pointer}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font-num);font-size:var(--fs-micro);fill:var(--text-muted)}
.chart .ttl{font-family:var(--font-body)}
.chart .lbl{fill:var(--text);font-weight:var(--fw-medium)}
.chart .lbl-strong{fill:var(--brand-primary);font-weight:var(--fw-semibold);font-family:var(--font-body)}
.chart .halo{stroke:var(--surface);stroke-width:var(--bw-3);paint-order:stroke;stroke-linejoin:round}
.chart .grid{stroke:var(--viz-grid);stroke-width:var(--bw)}
.chart .axis{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart .zero{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart .med{stroke:var(--viz-median);stroke-width:var(--bw);stroke-dasharray:4 3}
.chart .band{fill:var(--viz-band)}
.chart .bandt{fill:var(--brand-secondary);font-family:var(--font-body);font-weight:var(--fw-semibold)}
.chart .mk{stroke:var(--surface);stroke-width:var(--bw);transition:opacity var(--dur-1)}
.chart .mk.faded{opacity:.28}
.chart .mk.out{fill-opacity:.35}
.chart .mk.hl{stroke:var(--brand-primary);stroke-width:var(--bw-2)}
.chart .leader{stroke:var(--viz-axis);stroke-width:var(--bw)}
.chart [data-s]{transition:opacity var(--dur-1)}
.chart.hovering [data-s]:not(.on){opacity:.18}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-3);margin-top:var(--s-2);font-size:var(--fs-caption);color:var(--text-muted)}
.legend button{display:inline-flex;align-items:center;gap:var(--s-1);border:0;background:none;padding:var(--s-half) var(--s-1);border-radius:var(--r-1);color:inherit}
.legend button:hover{background:var(--hover-bg)}
.legend button[aria-pressed=false]{opacity:.4}
.legend svg{width:var(--s-3);height:var(--s-3)}
.legend .note{color:var(--text-subtle)}
.ch-anim .grow{transform-box:fill-box;transform-origin:bottom;animation:ch-grow var(--dur-3) var(--ease) both}
.ch-anim .growx{transform-box:fill-box;transform-origin:left;animation:ch-growx var(--dur-3) var(--ease) both}
.ch-anim .fade{animation:ch-fade var(--dur-2) var(--ease) backwards}
@keyframes ch-grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes ch-growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes ch-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .ch-anim .grow,.ch-anim .growx,.ch-anim .fade{animation:none} *{transition:none!important} }
.hbar{display:flex;height:var(--s-5);border-radius:var(--r-1);overflow:hidden;background:var(--surface-sunk)}
.hbar i{display:block;height:100%}
.gallery-item{border-top:var(--bw) solid var(--border);padding-top:var(--s-4)}
.axes{display:flex;gap:var(--s-2);align-items:center;font-size:var(--fs-caption);color:var(--text-muted)}
.axes select{font:inherit;font-size:var(--fs-caption);height:calc(var(--s-6) + var(--s-1));border:var(--bw) solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);color:var(--text);max-width:calc(var(--s-16) * 2.6)}

/* methodology */
.defs{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.defs th,.defs td{text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--bw) solid var(--border);vertical-align:top}
.defs th{color:var(--text-muted);font-weight:var(--fw-medium);font-size:var(--fs-caption)}
.prose{max-width:85ch;font-size:var(--fs-small)}
.prose p{margin:var(--s-0) var(--s-0) var(--s-3)}

/* ---------- print: IC pack (16:9) ---------- */
#pack{display:none}
body.printing.pack-preview > *:not(#pack):not(.tip){display:none!important} body.printing.pack-preview{background:var(--n-200)} body.printing.pack-preview #pack{display:block}
@page{size:13.333in 7.5in;margin:0}
@media print{
  body{background:var(--surface)}
  body.printing > *:not(#pack){display:none!important}
  body.printing #pack{display:block}
  body.print-compare .hdr, body.print-compare .side, body.print-compare .chipbar, body.print-compare .noprint{display:none!important}
  body.print-compare .shell{display:block}
  body.print-compare .main{padding:var(--s-0);max-width:none}
  .card{box-shadow:none}
}
.slide{width:13.333in;height:7.5in;position:relative;overflow:hidden;background:var(--surface);page-break-after:always;break-after:page;display:flex;flex-direction:column}
.slide:last-child{page-break-after:auto;break-after:auto}
.slide .sh{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--s-8) var(--s-3);border-bottom:var(--bw-2) solid var(--brand-primary);flex:none}
.slide .sh img{height:var(--s-6);width:auto}
.slide .sh h2{font-family:var(--font-display);color:var(--brand-primary);font-size:var(--fs-h1);font-weight:var(--fw-bold)}
.slide .sh .sec{margin-left:auto;font-size:var(--fs-caption);color:var(--text-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.slide .sb{flex:1;position:relative;overflow:hidden;padding:var(--s-4) var(--s-8)}
.slide .sb > .fit{transform-origin:top left;width:100%}
.slide .sf{display:flex;justify-content:space-between;gap:var(--s-4);padding:var(--s-2) var(--s-8);border-top:var(--bw) solid var(--border);font-size:var(--fs-micro);color:var(--text-muted);flex:none}
.slide.cover{background:var(--brand-primary);color:var(--text-on-brand);justify-content:center;padding:var(--s-0) var(--s-16)}
.slide.cover img{height:var(--s-12);width:auto;align-self:flex-start;margin-bottom:var(--s-12)}
.slide.cover h1{font-family:var(--font-display);color:var(--text-on-brand);font-size:var(--fs-display);margin-bottom:var(--s-3)}
.slide.cover p{margin:var(--s-0);color:var(--brand-accent);font-size:var(--fs-h2)}
.slide.cover .conf-big{margin-top:var(--s-12);border:var(--bw) solid var(--brand-accent);color:var(--brand-accent);align-self:flex-start;padding:var(--s-1) var(--s-3);letter-spacing:var(--tracking-caps);text-transform:uppercase;font-size:var(--fs-caption);border-radius:var(--r-1)}
.slide .tscroll{max-height:none;overflow:visible}
.slide .card{box-shadow:none}
.slide .cmp th,.slide .cmp td{padding:var(--s-1) var(--s-3)}
.slide .cmp td.l{white-space:nowrap}
.slide table.grid-t{width:100%}
.slide .grid-t td.first{max-width:none}

/* Greater Pacific dashboard kit — v2 interface layer (hero bands, navy shell, interactive charts, presentation mode).
   Tokens only (tokens.css). Loaded after base.css. */

/* ---------- navy shell ---------- */
.side{background:var(--side-bg);border-right-color:var(--side-border);color:var(--side-text)}
.side a{color:var(--side-text);position:relative}
.side a:hover{background:var(--side-hover);color:var(--side-text-strong)}
.side a[aria-current=page]{background:var(--side-active);color:var(--side-text-strong)}
.side a[aria-current=page]::before{content:"";position:absolute;left:calc(var(--s-2) * -1);top:var(--s-2);bottom:var(--s-2);width:var(--bw-3);border-radius:var(--r-pill);background:var(--side-accent)}
.side .ct{color:var(--side-accent)}
.side .sep{background:var(--side-border)}
.side .foot{color:var(--on-dark-subtle)}
.side .iconbtn{color:var(--side-text)}
.side .iconbtn:hover{background:var(--side-hover);color:var(--side-text-strong)}
.side .sideh{font-size:var(--fs-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--on-dark-subtle);padding:var(--s-3) var(--s-3) var(--s-1)}
.collapsed .side .sideh{display:none}
.hdr{backdrop-filter:saturate(1.4) blur(8px);background:color-mix(in srgb, var(--surface) 92%, transparent)}
.switch{display:inline-flex;border:var(--bw) solid var(--border);border-radius:var(--r-pill);padding:var(--s-half);gap:var(--s-half);background:var(--bg)}
.switch a{font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--text-muted);text-decoration:none;padding:var(--s-1) var(--s-3);border-radius:var(--r-pill);white-space:nowrap}
.switch a[aria-current=true]{background:var(--brand-primary);color:var(--text-on-brand)}
.switch a:hover:not([aria-current=true]){color:var(--text);background:var(--hover-bg)}
@media (max-width:1180px){ .hdr .switch{display:none} }
.hdr .prod{min-width:calc(var(--s-16) * 3);flex:0 1 auto}
@media (max-width:1640px){ .hdr > .caption{display:none} .searchbtn .lbl{display:none} .searchbtn{min-width:var(--s-8)} }
.main.enter > *{animation:page-in var(--dur-2) var(--ease) both}
.main.enter > *:nth-child(2){animation-delay:40ms} .main.enter > *:nth-child(3){animation-delay:80ms} .main.enter > *:nth-child(4){animation-delay:120ms} .main.enter > *:nth-child(n+5){animation-delay:160ms}
@keyframes page-in{from{opacity:0;transform:translateY(var(--s-2))}to{opacity:1;transform:none}}
.card{transition:box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease)}
.card.lift:hover{box-shadow:var(--shadow-hover);transform:translateY(calc(var(--s-half) * -1))}

/* ---------- hero band ---------- */
.hero{position:relative;overflow:hidden;color:var(--on-dark);border-radius:var(--r-4);padding:var(--hero-pad);margin-bottom:var(--s-5);
  background:radial-gradient(1200px 420px at 88% -20%, var(--hero-glow), transparent 60%), radial-gradient(700px 360px at 6% 120%, var(--hero-glow-2), transparent 60%), linear-gradient(125deg, var(--hero-from) 0%, var(--hero-mid) 55%, var(--hero-to) 100%);
  box-shadow:var(--shadow-3)}
.hero::before{content:"";position:absolute;inset:var(--s-0);background-image:linear-gradient(var(--hero-grid) var(--s-px), transparent var(--s-px)), linear-gradient(90deg, var(--hero-grid) var(--s-px), transparent var(--s-px));background-size:var(--s-8) var(--s-8);mask-image:linear-gradient(180deg, transparent, var(--n-900) 30%, var(--n-900) 70%, transparent);pointer-events:none}
.hero > *{position:relative}
.hero .cst-wrap{position:absolute;right:var(--s-0);top:var(--s-0);bottom:var(--s-0);width:58%;opacity:.9;pointer-events:none;mask-image:linear-gradient(90deg, transparent, var(--n-900) 35%)}
.hero .eyebrow{color:var(--on-dark-muted)}
.hero h1,.hero .hero-h{font-family:var(--font-display);color:var(--on-dark);font-size:var(--fs-hero);line-height:var(--lh-hero);font-weight:var(--fw-bold);margin:var(--s-2) var(--s-0) var(--s-1);max-width:48ch;text-wrap:balance}
.hero .hero-sub{color:var(--on-dark-muted);margin:var(--s-0);max-width:80ch}
.hero .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s-3);align-items:flex-start}
.hero .pill.pos{background:transparent;color:var(--positive-on-dark);border-color:var(--positive-on-dark)}
.hero .pill.warn{background:transparent;color:var(--warning-on-dark);border-color:var(--warning-on-dark)}
.hero .pill.neg{background:transparent;color:var(--negative-on-dark);border-color:var(--negative-on-dark)}
.hero .pill.info,.hero .pill.neu,.hero .pill.outline{background:var(--glass-bg);color:var(--on-dark);border-color:var(--glass-border)}
.hero .pill.brand{background:var(--on-dark);color:var(--brand-primary)}
.hero .vpill{color:var(--on-dark-muted)}
.hero a{color:var(--on-dark)}
.hero .btn{background:var(--glass-bg);border-color:var(--glass-border);color:var(--on-dark)}
.hero .btn:hover{background:var(--glass-bg-hover);color:var(--on-dark);border-color:var(--on-dark-border)}
.hero .btn.primary{background:var(--on-dark);color:var(--brand-primary);border-color:var(--on-dark)}
.hero .kpis{background:transparent;border:0;gap:var(--s-3);margin-top:var(--s-5);grid-template-columns:repeat(auto-fit,minmax(calc(var(--s-16) * 2.15),1fr));overflow:visible}
.hero .kpi{background:var(--glass-bg);border:var(--bw) solid var(--glass-border);border-radius:var(--r-3);backdrop-filter:blur(6px);color:var(--on-dark);transition:background var(--dur-1), transform var(--dur-2) var(--ease), border-color var(--dur-1)}

<script>/* Greater Pacific dashboard kit — charts. The single chart library for every dashboard (SVG, no dependencies).
   Standards: colours only from theme tokens (var(--viz-n)); every series also has a marker shape; direct labels
   preferred; clickable legends isolate a series; hover highlights one series and dims the rest; tooltips are
   sentences; medians dashed; bands shaded; entry animation honours prefers-reduced-motion (CSS). */
(function(){
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SHAPES = ["circle","square","triangle","diamond","tdown","cross","wye","star"];
function shapePath(kind, x, y, r){
  const p = (a)=>a.map((q,i)=>(i?"L":"M")+(x+q[0]).toFixed(1)+" "+(y+q[1]).toFixed(1)).join("")+"Z";
  switch(kind){
    case "square":  return p([[-r*.88,-r*.88],[r*.88,-r*.88],[r*.88,r*.88],[-r*.88,r*.88]]);
    case "triangle":return p([[0,-r*1.15],[r*1.05,r*.75],[-r*1.05,r*.75]]);
    case "tdown":   return p([[0,r*1.15],[r*1.05,-r*.75],[-r*1.05,-r*.75]]);
    case "diamond": return p([[0,-r*1.2],[r*1.05,0],[0,r*1.2],[-r*1.05,0]]);
    case "cross":   { const a=r*.38, b=r*1.05; return p([[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]]); }
    case "wye":     { const pts=[]; for(let i=0;i<6;i++){ const ang=-Math.PI/2+i*Math.PI/3, rr=i%2?r*.45:r*1.15; pts.push([Math.cos(ang)*rr,Math.sin(ang)*rr]); } return p(pts); }
    case "star":    { const pts=[]; for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.5:r*1.2; pts.push([Math.cos(ang)*rr,Math.sin(ang)*rr]); } return p(pts); }
    default: return `M${(x-r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
  }
}
const vizVar = i => `var(--viz-${(i%8)+1})`;
const shapeOf = i => SHAPES[i%SHAPES.length];
function legendSwatch(color, shape){ return `<svg viewBox="-7 -7 14 14" aria-hidden="true"><path d="${shapePath(shape||"circle",0,0,5)}" fill="${color}"/></svg>`; }

// ---------- scales ----------
function niceTicks(lo, hi, n=5){
  if(!isFinite(lo)||!isFinite(hi)){ lo=0; hi=1; }
  if(lo===hi){ lo-=1; hi+=1; }
  const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||10*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(10));
  return {a, b, t, step};

// ---------- dot plot vs peers (median + IQR) ----------
function dotPlot(host, o){

// ---------- labelled horizontal stacked bar (100%) ----------

// ---------- vertical columns (simple single-series, labelled) ----------
function columns(host, o){

// ======================================================================================

// ======================================================================================
// HistSlider (HTML+SVG): distribution of a metric with a two-thumb range; ends mean "no limit".
// ======================================================================================
class HistSlider{
  constructor(host, o){
    this.host=host; this.o=o; const vals=o.values.filter(v=>v!=null&&isFinite(v)); this.vals=vals;
    let [lo,hi]=robust(vals); if(lo===hi){ lo-=1; hi+=1; } this.lo=lo; this.hi=hi;
    this.bins=window.Kit.histogram(vals,lo,hi,o.bins||26); const mx=Math.max(1,...this.bins.map(b=>b.n));
    const W=240, Hh=30, bw=W/this.bins.length;
    host.innerHTML=`<div class="hs"><div class="hs-top"><span class="hs-lab">${esc(o.label)}</span><span class="hs-read num"></span></div>
      <svg class="hs-hist" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true">${this.bins.map((b,i)=>`<rect x="${i*bw+.5}" y="${Hh-Math.max(1.5,b.n/mx*Hh)}" width="${Math.max(.5,bw-1)}" height="${Math.max(1.5,b.n/mx*Hh)}"/>`).join("")}</svg>
      <div class="hs-range"><input type="range" class="hs-a" min="0" max="1000" step="1" aria-label="${esc(o.label)} minimum"><input type="range" class="hs-b" min="0" max="1000" step="1" aria-label="${esc(o.label)} maximum"></div>
      <div class="hs-ends num"><span>${esc(o.fmt(lo))}${vals.some(v=>v<lo)?" ≤":""}</span><span class="hs-n"></span><span>${vals.some(v=>v>hi)?"≥ ":""}${esc(o.fmt(hi))}</span></div></div>`;
    this.a=host.querySelector(".hs-a"); this.b=host.querySelector(".hs-b");
    const t2v=t=>this.lo+(this.hi-this.lo)*t/1000, v2t=v=>clamp(Math.round((v-this.lo)/((this.hi-this.lo)||1)*1000),0,1000);
    this.t2v=t2v; this.v2t=v2t;
    const live=()=>{ let a=+this.a.value, b=+this.b.value; if(a>b){ if(document.activeElement===this.a){ a=b; this.a.value=a; } else { b=a; this.b.value=b; } } this.paint(); };
    const commit=()=>{ const sel=this.sel(); if(o.onChange) o.onChange(sel); };
    [this.a,this.b].forEach(i=>{ i.addEventListener("input",live); i.addEventListener("change",commit); });
    this.set(o.sel||[null,null]);
  }
  sel(){ const a=+this.a.value, b=+this.b.value; const r=v=>+(+v.toPrecision(4)); return [a<=0?null:r(this.t2v(a)), b>=1000?null:r(this.t2v(b))]; }
  set([a,b]){ this.a.value=a==null?0:this.v2t(a); this.b.value=b==null?1000:this.v2t(b); this.paint(); }
  paint(){ const [a,b]=this.sel(), A=a==null?-Infinity:a, B=b==null?Infinity:b; const rects=this.host.querySelectorAll(".hs-hist rect");
    this.bins.forEach((bn,i)=>rects[i].classList.toggle("in", bn.x1>A&&bn.x0<B));
    const n=this.vals.filter(v=>v>=A&&v<=B).length; this.host.querySelector(".hs-n").textContent=(a==null&&b==null)?`${this.vals.length} companies`:`${n} in range`;
    this.host.querySelector(".hs-read").textContent=(a==null&&b==null)?"any":`${a==null?"…":this.o.fmt(a)} – ${b==null?"…":this.o.fmt(b)}`;
    const ta=+this.a.value/10, tb=+this.b.value/10; this.host.querySelector(".hs-range").style.setProperty("--a",ta+"%"); this.host.querySelector(".hs-range").style.setProperty("--b",tb+"%"); }
}

function enableDnD(board, ctx){

function sampleCtx(){
  const words=["Aurora","Beacon","Cobalt","Delta","Ember","Fable","Granite","Harbor","Iris","Juniper","Kestrel","Lumen","Meridian","Nimbus","Onyx","Pinnacle","Quarry","Ridge","Summit","Tidal","Umber","Vertex","Willow","Zenith","Atlas","Borealis","Cedar","Dune"];
  const gs=M.groups.filter(g=>!g.other).slice(0,6), crit=(M.scoring?M.scoring.criteria:[]);
  const cs=words.map((w,i)=>{ const g=gs[i%gs.length], m={}; Object.keys(MET).forEach(k=>{ const s=M.stats[k]; if(s&&s.n) m[k]=s.q1+(((i*37+k.length*11)%100)/100)*((s.q3-s.q1)||Math.abs(s.med)||1); });
    const sc={}; crit.forEach((k,j)=>{ sc[k.key]=((i*53+j*29)%100)/100; }); return {id:"sample-"+i,name:`${w} Sample Co`,prim:g.key,groups:[{key:g.key}],m,nm:{},sc,flags:[],verdict:null,pct:{},sample:true}; });
  const store=new window.Pipeline.Store({key:"sample",stages:ST,seed:()=>"long",memory:true});
  const day=86400000, now=Date.now(), iso=d=>new Date(now-d*day).toISOString(), due=d=>window.Pipeline.dayKey(new Date(now+d*day));
  const plan=[["ic","Principal","Final IC memo",3,"A",9],["ic","VP","Pre-IC review",-1,"A",21],["nda","Associate","Data room review",-2,"A",12],["nda","VP","Management meeting",5,"B",33],["engaged","Associate","Second call with promoter",1,"A",6],["engaged","VP","Site visit",9,"B",18],["engaged","Principal","Send NDA",2,"B",41],["outreach","Associate","Follow up on intro email",-3,"B",15],["outreach","Associate","Warm intro via advisor",12,"C",4],["outreach","VP","Call the promoter",0,"",27],["outreach","Principal","",null,"",8],["short","Associate","Desk diligence",6,"B",11],["short","","",null,"",3],["short","VP","Peer comparison",10,"C",24],["screened","","",null,"",5],["screened","","",null,"",2],["screened","","",null,"",19],["passed","VP","",null,"",14,"Valuation",4],["passed","Associate","",null,"",30,"Promoter not selling",3],["hold","Principal","",null,"",22,"Timing",5]];
  plan.forEach((p,i)=>{ const c=cs[i]; const [stage,owner,next,dd,pri,age,reason,peak]=p; const idx=IDX[stage]; const pk=peak!=null?peak:idx; const log=[];
    let t=age+6*Math.max(1,pk); for(let s=1;s<=pk;s++){ log.push({t:iso(t),k:"stage",from:FLOW[s-1].key,to:FLOW[s].key,by:owner||"Associate"}); t=Math.max(age,t-6); }
    if(stageOf(stage).closed) log.push({t:iso(age),k:"stage",from:FLOW[pk].key,to:stage,by:owner||"Associate"});
    if(next) log.push({t:iso(Math.max(0,age-1)),k:"edit",field:"next",to:next,by:owner||"Associate"});
    if(i%3===0) log.push({t:iso(Math.max(0,age-2)),k:"note",text:["Promoter open to a conversation; wants to understand our timeline.","Asked for three years of segment numbers.","Valuation expectations look high; revisit after results."][i%3===0?(i/3)%3:0],by:owner||"Associate"});
    store.state.recs[c.name]={stage,owner,next,due:dd==null?"":due(dd),pri,since:iso(age),peak:pk,reason:reason||"",u:iso(Math.max(0,age-1)),by:owner,log}; });
  return {cs, store, byId:new Map(cs.map(c=>[c.id,c])), sample:true};
}

<script>/* EMS target outreach — adapter. Turns ems/data.js (generated from the "Consol Target Outreach List" sheet)
   and ems/shortlist.js into the kit MODEL. Unlisted companies: no market, ownership or control data. */
(function(){
const K = window.Kit;
const TOP = 7; // largest segments get their own colour; the rest share the muted colour

function build(src, opts){
  const META = src.DATA_META || {};
  const SL = src.SHORTLIST || {names:[], notes:{}};
  const rows = src.RAW_BASE || [];
  const ids = K.uniqueSlugs(rows.map(r=>r.n));
  const shortNames = new Set(SL.names||[]);
  const segCount = {}; rows.forEach(r=>{ segCount[r.seg]=(segCount[r.seg]||0)+1; });
  const SEGS = Object.keys(segCount).sort((a,b)=>segCount[b]-segCount[a]||a.localeCompare(b));
  const segKey = s => String(SEGS.indexOf(s));

  const companies = rows.map((r,i)=>{
    const m = { r:r.r, e:r.e, p:r.p,
      em: r.r>0 && r.e!=null ? r.e/r.r*100 : null,
      pm: r.r>0 && r.p!=null ? r.p/r.r*100 : null,
      conv: r.e>0 && r.p!=null ? r.p/r.e*100 : null };
    const flags=[], dq=[];
    if(r.ev) flags.push({key:"evaluated",label:"Evaluated",tone:"info",tip:"“Whether evaluated?” is Yes in the sheet."});

function kpiTiles(cs, prevCs, opts={}){
  const vals=Object.fromEntries(M.kpis.map(k=>[k.key,k.value(cs)])), uni=vals.universe||cs.length;
  return M.kpis.map(k=>{ const v=vals[k.key], pv=prevCs?k.value(prevCs):null; let d="";
    if(pv!=null&&v!=null){ const diff=v-pv, ad=Math.abs(diff), dp=ad<0.05?2:1, dtxt=k.fmt==="int"?String(ad):k.fmt==="x"?nf(ad,dp)+"x":k.fmt==="pct"||k.fmt==="chg"?nf(ad,dp)+" pp":"₹"+nf(ad,dp)+" cr";
      d = ad<1e-9?`<span class="delta na">No change vs previous</span>`:`<span class="delta ${diff>0?"pos":"neg"}">${diff>0?"▲":"▼"} ${dtxt} vs previous</span>`; }
    else d=`<span class="delta na">${PREV?"–":"No previous snapshot"}</span>`;
    const metric=k.metric||(MET[k.key]?k.key:null);
    const cnt = v==null?"–" : k.fmt==="int"?String(Math.round(v)) : k.fmt==="cr"?nf(v,1) : fmt(null,v,null,{fmt:k.fmt});
    let mini="";

    const body=`<span class="eyebrow">${esc(k.label)}</span><span class="kpi-v">${cnt}${k.fmt==="cr"?"<small> ₹ cr</small>":""}</span>${mini}${d}<span class="ctx">${esc(k.ctx(cs))}</span>`;

    const paint=k=>{ const t=tabs.find(x=>x[0]===k); el.querySelector(".tabp").innerHTML = k==="src"?`<div class="srcs">${c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("")}<span class="subtle">checked ${esc(c.updated||"")}</span></div>`:`<ul class="notes">${t[2].map(x=>`<li>${safeHtml(x)}</li>`).join("")}</ul>`;
      el.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===k)); };
    el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ paint(b.dataset.tab); history.replaceState(null,"",href("company",c.id,withState(route().st,{tab:b.dataset.tab}))); }); paint(cur); }
  card("dqc","Contacts and data quality",`${c.dq.length} data-quality note${c.dq.length!==1?"s":""} for this company`,`

    ${c.dq.length?`<ul class="dq">${c.dq.map(d=>`<li>${pill(d.level==="neg"?"Error":d.level==="warn"?"Check":"Note",d.level==="neg"?"neg":d.level==="warn"?"warn":"info")}<span>${esc(d.text)}</span></li>`).join("")}</ul>`:`<p class="caption">No data-quality flags.</p>`}`);
};

const SL={board:null};
function rankRows(st){ const sl=M.companies.filter(c=>c.shortlisted); const def=sl.map(c=>({c,t:totalScore(c,{})})).sort((a,b)=>b.t-a.t).map(x=>x.c.id);
  return sl.map(c=>({c,parts:contributions(c,st),total:totalScore(c,st)})).sort((a,b)=>b.total-a.total).map((x,i)=>({...x,rank:i+1,delta:def.indexOf(x.c.id)+1-(i+1)})); }
function activePreset(st){ const w=weights(st); const p=(M.scoring.presets||[]).find(p=>CRIT.every(k=>(p.w[k.key]??0)===w[k.key])); return p?p.key:"custom"; }
function scard(x, st){ const c=x.c, keys=M.company.kpis.slice(0,3);
  return `<article class="card scard lift" data-id="${esc(c.id)}">${c.verdict&&x.rank===1?`<span class="ribbon">Top ranked</span>`:""}<div class="top2"><div class="mini-radar" data-r="${esc(c.id)}"></div><div style="min-width:var(--s-0)"><span class="rank">#${x.rank}</span><a class="cname" href="${href("company",c.id,filterOnly(st))}">${esc(c.name)}</a><div class="cmeta">${c.ticker?`<span>${esc(c.ticker)}</span>`:""}${c.groups.map(g=>gpill(g.key)).join("")}</div></div></div>
    <div class="pills">${c.verdict?pill(c.verdict.label,c.verdict.tone):pill("No verdict yet","outline")}<span class="pill info sc-pill" data-tip="Weighted score on the current weights">Score ${x.total.toFixed(0)}</span></div>
    <p class="thesis">${esc(c.thesis||"No thesis recorded.")}</p>
    <div class="mini">${keys.map(k=>`<div>${esc(MET[k].short)}<b>${fmt(k,c.m[k],c)}</b></div>`).join("")}</div>
    <div class="caption">${c.open.length} open diligence item${c.open.length!==1?"s":""} · updated ${esc(c.updated||"n/a")}</div></article>`; }
PAGES.shortlist = (main, st)=>{

  <section class="hero" style="padding:var(--s-5) var(--hero-pad)"><div class="hero-top"><div><span class="eyebrow">Shortlist · stored in the repo (${esc(M.shortlistFile)})</span><h1 class="hero-h" style="font-size:var(--fs-display)">${sl.length?`${sl.length} compan${sl.length>1?"ies":"y"} under consideration`:"No shortlist yet"}</h1><p class="hero-sub">One list for the whole team. Move the weights and watch the ranking re-order; the weights travel with the link.</p></div>

  ${pend.length?`<section class="card" style="margin-bottom:var(--s-4);border-color:var(--warning)"><div class="card-h"><div><h2>${pend.length} staged change${pend.length>1?"s":""} not yet published</h2><div class="sub">Staged in this browser only. Publishing updates ${esc(M.shortlistFile)} in the repo for everyone.</div></div>
    <div class="pills"><button class="btn primary sm" id="pub">Copy file and open GitHub editor</button><button class="btn sm" id="discard">Discard</button></div></div>
    <ul class="chg">${pend.map(([n,v])=>`<li>${pill(v?"Add":"Remove",v?"pos":"neg")}<span class="what">${esc(n)}</span><span></span></li>`).join("")}</ul></section>`:""}
  ${sl.length?`<section class="card" id="scoreCard"><div class="card-h"><div><h2 id="scT"></h2><div class="sub">Score 0–100 = Σ weight × criterion score (0–1) ÷ Σ weights · criteria scored across all ${M.companies.length} companies · ▲▼ = places moved vs default weights</div></div><button class="btn sm" id="resetW">Reset weights</button></div>
    <div class="wpresets"><span class="lbl">Presets</span><span class="seg" id="wps">${(M.scoring.presets||[]).map(p=>`<button type="button" data-p="${p.key}" aria-pressed="false">${esc(p.label)}</button>`).join("")}<button type="button" data-p="custom" aria-pressed="false" disabled>Custom</button></span></div>
    <div class="wts">${CRIT.map(k=>`<label class="wt" data-tip="${esc(k.explain)}"><span>${esc(k.label)}</span><b id="w-${k.key}">${w[k.key]}</b><input type="range" min="0" max="50" step="5" value="${w[k.key]}" data-w="${k.key}" aria-label="${esc(k.label)} weight"></label>`).join("")}</div>
    ${M.scoring.unavailable?`<p class="caption">${esc(M.scoring.unavailable)}</p>`:""}
    <div id="sbHost" style="margin-top:var(--s-4)"></div><div class="legend" id="sbL"></div></section>
  <div class="cards" id="cards" style="margin-top:var(--s-4)">${rows.map(x=>scard(x,st)).join("")}</div>`
  :`<div class="empty-cta"><b>The shortlist is empty.</b><span>Star companies in the screener (☆ next to each name), then publish the shortlist from here so the whole team sees one list.</span><a class="btn sm" href="${href("screener","",{})}">Open screener</a></div>`}`;
  main.querySelector("#slPresent").onclick=()=>Present.open();
  const pub=main.querySelector("#pub"); if(pub) pub.onclick=()=>{ const txt=shortlistFileText(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{ toast("New shortlist file copied. Paste it over the file in GitHub and commit."); window.open(`https://github.com/${M.repo}/edit/main/${M.shortlistFile}`,"_blank","noopener"); }).catch(()=>{ download(new Blob([txt],{type:"text/javascript"}),M.shortlistFile.split("/").pop()); toast("Clipboard blocked: file downloaded instead."); }); };
  const dis=main.querySelector("#discard"); if(dis) dis.onclick=()=>{ setDraft({}); render(); };
  if(!sl.length) return;
  main.querySelectorAll(".mini-radar").forEach(h=>{ const c=byId.get(h.dataset.r); C.radar(h,{compact:true,height:118,axes:radarAxes(),series:[{key:c.id,label:c.name,color:"var(--viz-1)",values:c.sc,fill:true}],aria:`Score shape for ${c.name}`}); });
  SL.board=new C.Scoreboard(main.querySelector("#sbHost"),{rowH:44,max:100,keys:CRIT.map((k,j)=>({key:k.key,label:k.label,color:C.vizVar(j)}))});
  C.legend(main.querySelector("#sbL"),CRIT.map((k,j)=>({key:k.key,label:k.label,color:C.vizVar(j),shape:"square"})),null,"Bars stack each criterion's contribution");

    if(animate) C.flip(cards,".scard","data-id",move); else move(); };

  let wt; main.querySelectorAll("[data-w]").forEach(r=>r.oninput=()=>{ const s=route().st; const w2={...weights(s),[r.dataset.w]:+r.value}; main.querySelector("#w-"+r.dataset.w).textContent=r.value; history.replaceState(null,"",href("shortlist","",withState(s,{w:w2}))); clearTimeout(wt); wt=setTimeout(()=>draw(true),60); });
  main.querySelectorAll("#wps [data-p]").forEach(b=>b.onclick=()=>{ const p=(M.scoring.presets||[]).find(x=>x.key===b.dataset.p); if(p) setW({...p.w},true); });
  main.querySelector("#resetW").onclick=()=>setW(Object.fromEntries(CRIT.map(k=>[k.key,k.weight])),true);
};

PAGES.compare = (main, st)=>{
  let ids=(st.c||[]).filter(id=>byId.has(id)).slice(0,5);
  if(!ids.length) ids=M.companies.filter(c=>c.shortlisted).map(c=>({c,t:totalScore(c,st)})).sort((a,b)=>b.t-a.t).slice(0,5).map(x=>x.c.id);
  const cs=ids.map(id=>byId.get(id));
  const best=(k,vals)=>{ const b=(MET[k]||{}).better; const ok=vals.filter(v=>v!=null&&isFinite(v)); if(!b||ok.length<2) return {}; const mx=Math.max(...ok), mn=Math.min(...ok); if(mx===mn) return {}; return b==="high"?{best:mx,worst:mn}:{best:mn,worst:mx}; };
  const rowHtml=(k)=>{ const vals=cs.map(c=>c.nm&&c.nm[k]?null:c.m[k]); const bw=best(k,vals); return `<tr><td class="l" data-tip="${esc(headerTip(k))}">${esc(MET[k].label)} <span class="subtle">${esc(unitOf(k))}</span></td>${cs.map((c,i)=>{ const p=MET[k].better?c.pctGood[k]:c.pct[k]; return `<td class="${vals[i]!=null&&vals[i]===bw.best?"best":vals[i]!=null&&vals[i]===bw.worst?"worst":""}">${fmt(k,c.m[k],c)}${p!=null?`<span class="cbar" data-tip="${esc(`${Math.round(p)}${MET[k].better?" (100 = best)":""} percentile in the universe`)}"><i style="width:${p.toFixed(0)}%"></i></span>`:""}</td>`; }).join("")}</tr>`; };
  const opts=M.companies.filter(c=>!ids.includes(c.id)).sort((a,b)=>(b.shortlisted-a.shortlisted)||a.name.localeCompare(b.name));
  const axes=M.compare.flatMap(s=>s.rows).filter(k=>MET[k]&&M.stats[k]&&M.stats[k].n>2);
  const lead=cs.length?cs.map(c=>({c,n:axes.filter(k=>{ const p=x=>MET[k].better?x.pctGood[k]:x.pct[k]; const v=p(c); return v!=null&&cs.every(o=>p(o)==null||p(o)<=v); }).length})).sort((a,b)=>b.n-a.n)[0]:null;
  main.innerHTML=`
    <div class="ph"><div><span class="eyebrow">Compare</span><h1>Side by side</h1><p>Up to five companies. Green = best and red = worst in each row, using each metric's direction (e.g. lower P/E is better).</p></div>
      <div class="acts noprint">${ids.length<5?`<label class="sr" for="addc">Add company</label><select id="addc" class="inp" style="width:auto"><option value="">Add a company…</option>${opts.map(c=>`<option value="${c.id}">${c.shortlisted?"★ ":""}${esc(c.name)}</option>`).join("")}</select>`:""}<button class="btn" id="prt">${icon("print")}Print</button></div></div>
    ${cs.length>0?`<section class="card noprint" style="margin-bottom:var(--s-4)"><div class="card-h"><div><h2>${esc(lead&&lead.n?`${shortName(lead.c.name)} leads on ${lead.n} of ${axes.length} measures`:"Profiles across the measures")}</h2><div class="sub">Percentile within the universe, 0–100 (100 = best) · hover a line or an axis · click a name to isolate it</div></div></div><div class="pc-scroll" id="pc"></div><div class="legend" id="pcL"></div></section>
      <div class="grid g2 noprint" style="margin-bottom:var(--s-4)">${CRIT.length?`<section class="card"><div class="card-h"><div><h2>Score shapes</h2><div class="sub">Percentile score 0–100 per criterion · hover an axis</div></div></div><div id="cr"></div></section>`:""}
      <section class="card"><div class="card-h"><div><h2>Who leads where</h2><div class="sub">Measures on which each company has the best percentile among those compared (100 = best)</div></div></div><div class="lw">${cs.map((c,j)=>{ const won=axes.filter(k=>{ const p=x=>MET[k].better?x.pctGood[k]:x.pct[k]; const v=p(c); return v!=null&&cs.every(o=>o===c||p(o)==null||p(o)<v); }); return `<div class="lw-row"><span class="lw-n">${C.legendSwatch(C.vizVar(j),C.shapeOf(j))}<b>${esc(shortName(c.name))}</b> <span class="num subtle">${won.length}</span></span><span class="pills">${won.map(k=>`<span class="pill outline">${esc(MET[k].short)}</span>`).join("")||`<span class="caption">None outright</span>`}</span></div>`; }).join("")}</div></section></div>`:""}
    ${cs.length?`<section class="card flush"><div class="tscroll" style="max-height:none"><table class="cmp"><thead><tr><th class="l">Metric</th>${cs.map(c=>`<th><a href="${href("company",c.id,filterOnly(st))}">${esc(shortName(c.name))}</a><div class="caption">${esc(c.ticker||G[c.prim]?.short||"")}</div><button class="linkbtn noprint" data-rm="${c.id}" aria-label="Remove ${esc(c.name)}">remove</button></th>`).join("")}</tr></thead>
      <tbody>${M.compare.map(sec=>`<tr class="sec"><td colspan="${cs.length+1}">${esc(sec.sec)}</td></tr>${sec.rows.map(rowHtml).join("")}`).join("")}
      <tr class="sec"><td colspan="${cs.length+1}">Score</td></tr><tr><td class="l">Weighted score (0–100)</td>${(()=>{ const v=cs.map(c=>totalScore(c,st)); const mx=Math.max(...v), mn=Math.min(...v); return v.map(x=>`<td class="${cs.length>1&&x===mx?"best":cs.length>1&&x===mn?"worst":""}">${x.toFixed(1)}</td>`).join(""); })()}</tr>
      <tr><td class="l">Verdict</td>${cs.map(c=>`<td class="note">${c.verdict?pill(c.verdict.label,c.verdict.tone):"–"}</td>`).join("")}</tr>
      <tr class="sec"><td colspan="${cs.length+1}">Pipeline</td></tr><tr><td class="l">Stage</td>${cs.map(c=>`<td class="note">${PUI?PUI.stagePill(c):"–"}</td>`).join("")}</tr><tr><td class="l">Owner · next step</td>${cs.map(c=>{ const r=PIPE.get(c); return `<td class="note">${esc([r.owner,r.next].filter(Boolean).join(" · ")||"–")}</td>`; }).join("")}</tr>
      <tr class="sec"><td colspan="${cs.length+1}">Notes</td></tr><tr><td class="l">Thesis / notes</td>${cs.map(c=>`<td class="note">${esc(c.thesis||"–")}</td>`).join("")}</tr></tbody></table></div></section>`
    :`<div class="empty">Nothing to compare. Add companies above or shortlist some first.</div>`}
    <p class="caption">Prints on one landscape page. Figures as of ${esc(M.asof||"n/a")}.</p>`;
  const add=main.querySelector("#addc"); if(add) add.onchange=()=>{ if(add.value) go("compare","",withState(st,{c:ids.concat(add.value)})); };
  main.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>go("compare","",withState(st,{c:ids.filter(x=>x!==b.dataset.rm)})));
  main.querySelector("#prt").onclick=()=>{ document.body.classList.add("print-compare"); window.print(); setTimeout(()=>{ document.body.classList.remove("print-compare"); },500); };
  if(!cs.length) return;
  const ser=cs.map((c,j)=>({id:c.id,key:c.id,label:shortName(c.name),color:C.vizVar(j),shape:C.shapeOf(j)}));
  C.parallel(main.querySelector("#pc"),{aria:"Percentile profiles of the compared companies",axes:axes.map(k=>({key:k,label:MET[k].short,note:`${MET[k].label}${MET[k].better?` · ${MET[k].better==="high"?"higher":"lower"} is better`:""}`})),
    series:ser.map((s,j)=>({...s,pts:Object.fromEntries(axes.map(k=>{ const c=cs[j], p=MET[k].better?c.pctGood[k]:c.pct[k]; return [k,{p,raw:c.nm&&c.nm[k]?"n.m.":fmtPlain(k,c.m[k])}]; }))}))});
  if(CRIT.length) C.radar(main.querySelector("#cr"),{axes:radarAxes(),series:cs.map((c,j)=>({key:c.id,label:shortName(c.name),color:C.vizVar(j),values:c.sc,fill:j===0,shape:C.shapeOf(j)})),aria:"Score shapes of the compared companies"});
  legendIsolate(main.querySelector("#pcL"),()=>[main.querySelector(".pc"),main.querySelector("#cr .radar")].filter(Boolean),ser.map(s=>({key:s.key,label:s.label,color:s.color,shape:s.shape})));
};

PAGES.dq = (main, st)=>{
  const all=M.companies.flatMap(c=>c.dq.map(d=>({...d,c})));
  const n=l=>all.filter(d=>d.level===l).length;
  const cs=M.companies.filter(c=>c.dq.length).sort((a,b)=>b.dq.filter(d=>d.level!=="info").length-a.dq.filter(d=>d.level!=="info").length||a.name.localeCompare(b.name));
  main.innerHTML=`<div class="ph"><div><span class="eyebrow">Data quality</span><h1>Figures to check</h1><p>Issues are flagged, never “fixed” in the dashboard. Correct the source file and the next refresh picks it up.</p></div></div>
    <section class="kpis"><div class="kpi"><span class="eyebrow">Errors</span><span class="kpi-v">${n("neg")}</span><span class="ctx">e.g. failed refresh</span></div><div class="kpi"><span class="eyebrow">To check</span><span class="kpi-v">${n("warn")}</span><span class="ctx">figures that look wrong</span></div><div class="kpi"><span class="eyebrow">Notes</span><span class="kpi-v">${n("info")}</span><span class="ctx">missing or not meaningful</span></div><div class="kpi"><span class="eyebrow">Snapshot</span><span class="kpi-v" style="font-size:var(--fs-h2)">${PREV?"Available":"None yet"}</span><span class="ctx">${esc(PREV?`previous: ${PREV.asof||M.prevLabel||""}`:"builds from the next refresh")}</span></div></section>
    ${M.dqGlobal.length?`<section class="card" style="margin-top:var(--s-4)"><h2>Dataset</h2><ul class="dq" style="margin-top:var(--s-2)">${M.dqGlobal.map(d=>`<li>${pill(d.level==="neg"?"Error":"Check",d.level==="neg"?"neg":"warn")}<span>${esc(d.text)}</span></li>`).join("")}</ul></section>`:""}
    <section class="card flush" style="margin-top:var(--s-4)"><div class="tscroll"><table class="grid-t"><thead><tr class="cols"><th class="l stk">Company</th><th class="l">Issues</th></tr></thead><tbody>
      ${cs.map(c=>`<tr data-id="${c.id}"><td class="l stk first"><a class="cname" href="${href("company",c.id,filterOnly(st))}">${esc(c.name)}</a></td><td class="l" style="white-space:normal"><ul class="dq">${c.dq.map(d=>`<li>${pill(d.level==="neg"?"Error":d.level==="warn"?"Check":"Note",d.level==="neg"?"neg":d.level==="warn"?"warn":"info")}<span>${esc(d.text)}</span></li>`).join("")}</ul></td></tr>`).join("")}
    </tbody></table></div></section>`;
};
PAGES.method = (main)=>{
  main.innerHTML=`<div class="ph"><div><span class="eyebrow">Methodology</span><h1>How the numbers are built</h1></div></div>
    <div class="grid g2">${M.methodology.map(s=>`<section class="card prose"><h2>${esc(s.h)}</h2>${s.p.map(p=>`<p>${esc(p)}</p>`).join("")}</section>`).join("")}
    <section class="card prose"><h2>Scoring</h2>${CRIT.map(k=>`<p><b>${esc(k.label)}</b> (default weight ${k.weight}): ${esc(k.explain)}</p>`).join("")}${M.scoring.unavailable?`<p>${esc(M.scoring.unavailable)}</p>`:""}</section>
    <section class="card prose"><h2>Formats, charts and accessibility</h2><p>₹ crore to one decimal with Indian digit grouping; multiples as 8.3x; growth and margins signed to one decimal; negatives in red with a minus sign. Growth off a small or negative base shows n.m. with the reason on hover.</p><p>Percentiles rank each company within the universe (100 = best where a metric has a direction). The radar, swarm, treemap colours and profile lines use these percentiles; every underlying figure is in the screener.</p><p>Colours come from the Greater Pacific palette; every chart series also has its own marker shape, so colour is never the only cue. All text meets WCAG AA contrast. Animations are switched off when the device asks for reduced motion.</p></section></div>
    <section class="card flush" style="margin-top:var(--s-4)"><div class="card-h"><h2>Definitions</h2></div><div class="tscroll" style="max-height:none"><table class="defs"><thead><tr><th>Measure</th><th>Definition</th><th>Formula</th><th>Source</th><th>As of</th></tr></thead><tbody>
      ${Object.entries(MET).map(([k,m])=>`<tr><td><b>${esc(m.label)}</b></td><td>${esc(m.def||"")}</td><td>${esc(m.formula||"")}</td><td>${esc(m.source||"")}</td><td class="num">${esc(m.asof||"–")}</td></tr>`).join("")}</tbody></table></div></section>`;
};

PAGES.dev = (main, st, arg, same)=>{

function fitSlides(root){
  root.querySelectorAll(".sb").forEach(sb=>{ const f=sb.firstElementChild, cs=getComputedStyle(sb);
    const W=sb.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), H=sb.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const fits=s=>{ f.style.width=(W/s)+"px"; return f.scrollHeight*s<=H+0.5 && f.scrollWidth*s<=W+0.5; };
    let lo=0.5, hi=1; if(fits(1)){ lo=1; } else { for(let i=0;i<10;i++){ const mid=(lo+hi)/2; if(fits(mid)) lo=mid; else hi=mid; } }
    f.style.width=(W/lo)+"px"; f.style.transform=`scale(${lo})`; f.dataset.scale=lo.toFixed(3);
    if(f.scrollHeight*lo>H+1) sb.dataset.overflow="1"; });
  const pages=root.querySelectorAll(".slide"); pages.forEach((p,i)=>{ const pg=p.querySelector(".pg"); if(pg) pg.textContent=`Page ${i+1} of ${pages.length}`; });
}

    p.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>{ const a=b.dataset.pv; if(a==="prev") this.go(this.i-1); else if(a==="next") this.go(this.i+1); else if(a==="close") this.close(); else if(a==="pack"){ this.close(); exportPack(); } });

    this.go(start||0); p.querySelector("[data-pv=next]").focus(); },
  layout(){ const stage=document.querySelector("#present .pv-stage"); if(!stage) return; const W=stage.clientWidth, H=stage.clientHeight; const s=Math.max(.2,Math.min((W-32)/1280,(H-24)/720)); this.slides.forEach(sl=>{ sl.style.transform=`translate(-50%,-50%) scale(${s})`; }); },
  go(i){ if(!this.n) return; this.i=Math.max(0,Math.min(this.n-1,i)); this.slides.forEach((s,j)=>s.classList.toggle("on",j===this.i));
    const p=document.getElementById("present"); p.querySelector(".pv-count").textContent=`${this.i+1} / ${this.n}`; p.querySelectorAll("[data-pv-i]").forEach((b,j)=>b.setAttribute("aria-current",j===this.i)); },
  close(){ const p=document.getElementById("present"); if(!p||p.hidden) return; p.hidden=true; p.querySelector(".pv-stage").innerHTML=""; this.slides=[]; this.n=0; removeEventListener("resize",this._rz); C.Tip.hide();
    try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){} document.getElementById("presentBtn")?.focus(); },
  key(e){ const k=e.key; if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ e.preventDefault(); this.go(this.i+1); } else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ e.preventDefault(); this.go(this.i-1); } else if(k==="Home"){ e.preventDefault(); this.go(0); } else if(k==="End"){ e.preventDefault(); this.go(this.n-1); } else if(k==="Escape"){ e.preventDefault(); this.close(); } } };
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement&&!document.getElementById("present")?.hidden) Present.layout(); });

PAGES.pipeline = (main, st, arg, same)=>{ if(!PUI){ main.innerHTML=`<div class="empty">Pipeline module missing.</div>`; return; } PUI.page(main, st, arg, same); };
const PUI = window.PipelineUI ? window.PipelineUI({M,G,MET,C,esc,fmt,fmtPlain,href,go,route,withState,filterOnly,pill,icon,shortName,totalScore,toast,nf,PIPE,RM,addCompare,download,present:()=>Present.open()}) : null;

// ---------- boot ----------
PIPE.init();
shell();
addEventListener("hashchange", render);
addEventListener("popstate", render);
let rz, rw=innerWidth; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(Math.abs(innerWidth-rw)>40 && !document.body.classList.contains("printing") && document.getElementById("present").hidden){ rw=innerWidth; lastKey=""; OV.tmKey=""; render(); } },200); });
render();
if(route().st.pack){ buildPack(); document.body.classList.add("pack-preview"); document.documentElement.setAttribute("data-pack-ready","1"); }
else if(route().st.pv){ Present.open(route().st.pv-1); }
window.__APP = { render, route, filtered, sorted, fmt, fmtPlain, buildPack, M, PREV, PAGES, OV, SCR, SL, Present, PIPE, PUI };
})();
